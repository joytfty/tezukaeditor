<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>Estudio del Mangaka</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%96%8B%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f3ef; --panel:#ffffff; --ink:#231f1c; --sub:#6b6259; --line:#e4ddd3;
  --accent:#d1495b; --accent2:#2b2118; --chip:#efe8dd;

}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#181513;--panel:#221e1b;--ink:#efe8df;--sub:#a89e92;--line:#3a332c;--accent:#e8637a;--accent2:#efe8df;--chip:#2c2621;}
}
:root[data-theme="dark"]{--bg:#181513;--panel:#221e1b;--ink:#efe8df;--sub:#a89e92;--line:#3a332c;--accent:#e8637a;--accent2:#efe8df;--chip:#2c2621;}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,'Segoe UI',Roboto,sans-serif;height:100%;}
h1,h2,h3{font-family:Georgia,serif;margin:0 0 8px;}
textarea,input[type=text]{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font-family:inherit;font-size:15px;}
textarea{min-height:70px;resize:vertical;}
button{cursor:pointer;border:none;border-radius:8px;padding:9px 14px;font-size:14px;font-family:inherit;background:var(--accent);color:#fff;}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
button:disabled{opacity:.4;cursor:not-allowed;}
.top{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--line);}
.tabs{display:flex;gap:6px;padding:10px;overflow-x:auto;}
.tabs button{background:var(--chip);color:var(--ink);white-space:nowrap;}
.tabs button.active{background:var(--accent2);color:var(--bg);}
main{max-width:760px;margin:0 auto;padding:14px 14px 40px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;}

.subtabs{display:flex;gap:6px;margin:12px 0;}
.subtabs button{flex:1;background:var(--chip);color:var(--ink);}
.subtabs button.active{background:var(--accent);color:#fff;}
label{font-size:12px;color:var(--sub);display:block;margin:8px 0 4px;font-weight:600;}
.photobox{width:100%;aspect-ratio:1/1;max-width:220px;margin:0 auto;border:2px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--chip);}
.photobox img{width:100%;height:100%;object-fit:cover;}
.charcard{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;}
.charcard img,.charcard .ph{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--chip);}
.suceso{display:flex;gap:8px;align-items:flex-start;margin-bottom:10px;}
.suceso .num{font-weight:700;color:var(--accent);padding-top:10px;min-width:70px;}
.small{font-size:12px;color:var(--sub);}
.imgprev{width:70px;height:70px;object-fit:cover;border-radius:8px;margin:4px;}
.result h4{margin:14px 0 4px;color:var(--accent);}
.result p{white-space:pre-wrap;line-height:1.5;}
.pagesgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;margin:10px 0;}
.pagecard{position:relative;aspect-ratio:2/3;border-radius:8px;overflow:hidden;cursor:pointer;background:var(--chip);border:1px solid var(--line);}
.pagecard img{width:100%;height:100%;object-fit:cover;}
.pagecard .rm{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.65);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:12px;line-height:20px;padding:0;}

.pviewer{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:70;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
.pvtop{display:flex;gap:6px;padding:8px;align-items:center;flex-wrap:wrap;}
.pvtop button{background:#ffffff22;color:#fff;font-size:13px;}

.pvscroll{flex:1;overflow:auto;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch;}

.betalayout{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start;}
.betamain{flex:1 1 280px;min-width:260px;}
.betaside{flex:1 1 280px;min-width:260px;}
.modebar,.filterbar{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px;}
.modebar button,.filterbar button{background:var(--chip);color:var(--ink);font-size:12px;padding:6px 10px;}
.modebar button.active{background:var(--accent2);color:var(--bg);}

.viewer{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:60;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}

.vimgwrap .inner{position:relative;display:inline-block;margin:auto;}
.vimgwrap img{display:block;max-width:100%;}
.dot{position:absolute;width:22px;height:22px;background:var(--accent);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;transform:translate(-50%,-50%);cursor:pointer;border:2px solid #fff;}

.comparewrap>div{flex:1;display:flex;align-items:flex-start;justify-content:center;overflow:auto;}
.comparewrap img{max-width:100%;}

details.settings{margin:8px 0;border:1px solid var(--line);border-radius:8px;padding:8px;}

.concept{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;}
.concept .fld{margin:6px 0;font-size:13px;line-height:1.4;}
.concept .fld b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.03em;color:var(--accent);margin-bottom:2px;}

.libcard{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--panel);}
.libcard .top{display:flex;justify-content:space-between;gap:6px;align-items:center;}
.kanban{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;}
.kancol{flex:0 0 155px;background:var(--chip);border-radius:10px;padding:8px;}
.kancol h4{font-size:11px;margin:0 0 8px;color:var(--sub);text-transform:uppercase;}
.kcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px;margin-bottom:8px;font-size:12px;}
.kcard select{width:100%;margin-top:4px;font-size:11px;padding:3px;border-radius:5px;}
.metricsrow{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
.metricsrow input{width:52px;padding:3px;font-size:11px;border-radius:5px;border:1px solid var(--line);background:var(--panel);color:var(--ink);}
.metricsrow label{font-size:9px;color:var(--sub);display:flex;flex-direction:column;gap:1px;margin:0;}
.thumbmini{width:56px;height:56px;object-fit:cover;border-radius:6px;position:relative;}
.medialist{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;}
.medialist .mi{position:relative;}
.medialist .mi button{position:absolute;top:-5px;right:-5px;width:18px;height:18px;padding:0;border-radius:50%;font-size:10px;line-height:18px;}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
.storycard{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;}
.storycard .cover{width:100%;aspect-ratio:3/4;background:var(--chip);display:flex;align-items:center;justify-content:center;overflow:hidden;}
.storycard .cover img{width:100%;height:100%;object-fit:cover;}
.storycard .body{padding:8px;}
.storycard h4{margin:0 0 3px;font-size:14px;}
.storycard .tags{display:flex;flex-wrap:wrap;gap:3px;margin:4px 0;}
.tag{font-size:9px;background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:2px 6px;}
.estado-badge{font-size:9px;background:var(--accent);color:#fff;border-radius:8px;padding:2px 6px;}
.cardacts{display:flex;gap:3px;padding:0 8px 8px;flex-wrap:wrap;}
.cardacts button{font-size:10px;padding:4px 6px;}
.searchbar{width:100%;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);margin-bottom:8px;}
.ideacard{display:flex;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;}
.ideacard span{flex:1;font-size:13px;}
.relnet{width:100%;height:220px;background:var(--chip);border-radius:10px;margin:10px 0;}
.relrow{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:6px;font-size:13px;flex-wrap:wrap;}
.relrow select,.relrow input{padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);}
.charname{font-weight:700;}
.pr input[type=number],.pr input[type=date],.pr select{padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font-family:inherit}
.pr-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:12px}
.pr-t{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.pr-t b{display:block;font-size:10px;letter-spacing:.05em;color:var(--sub)}
.pr-t span{font-family:Georgia,serif;font-size:22px}
.pr-t small{display:block;font-size:11px;color:var(--sub)}
.pr-bar{height:6px;background:var(--chip);border-radius:4px;overflow:hidden}.pr-bar i{display:block;height:100%;background:var(--accent)}
.pr-big{width:100%;padding:14px;font-size:16px;letter-spacing:.03em}
.pr-trk{border-left:4px solid var(--accent)}
.pr-clock{font-family:Georgia,serif;font-size:26px}
.pr-pgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.pr-pg{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;font-size:12px}
.pr-pg.blq{border-color:var(--accent)}
.pr-cal{display:grid;gap:4px}
.pr-cd{min-height:64px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px;font-size:10px;overflow:hidden}
.pr-cd.off{opacity:.45}.pr-cd.buf{background:var(--chip)}.pr-cd.hoy{outline:2px solid var(--accent)}
.pr-warn{border-left:3px solid var(--accent);background:var(--chip);padding:8px 12px;border-radius:0 8px 8px 0;margin-bottom:10px;font-size:14px}
#mkFab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:80;border-radius:22px;padding:11px 16px;box-shadow:0 2px 10px rgba(0,0,0,.3)}
#mkBadge{display:none;background:#fff;color:var(--accent);border-radius:10px;font-style:normal;font-size:11px;font-weight:700;padding:1px 6px;margin-left:6px}
#mkPanel{position:fixed;right:12px;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:80;width:min(400px,calc(100vw - 24px));height:min(72vh,580px);background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;box-shadow:0 6px 24px rgba(0,0,0,.35)}
#mkPanel[hidden]{display:none}
#mkPanel select{padding:5px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font-size:12px}
.mkm{max-width:90%;padding:8px 10px;border-radius:10px;margin:6px 0;font-size:14px;line-height:1.4;white-space:pre-wrap}
.mkm.u{margin-left:auto;background:var(--accent);color:#fff}.mkm.a{background:var(--chip)}
.mkb{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.mkb button{font-size:12px;padding:5px 9px}
</style>

<body>
<div class="top">
<div class="row" style="padding:0 10px;justify-content:space-between;align-items:center;">
<div class="tabs" id="mainTabs" style="padding:10px 0;"></div>
<button class="ghost" onclick="openSettings()" style="white-space:nowrap;">⚙ Configuración</button>
</div>
<div id="saveStatus" class="small" style="padding:0 10px 6px;">Guardado</div>
</div>
<main id="view"></main>
<script>
let DATA = JSON.parse(localStorage.getItem('emk_data')||'{"stories":[]}');
if(!DATA.puente) DATA.puente={biblioteca:[],personality:{tono:'',modismos:true}};
DATA.ideas=DATA.ideas||[];
DATA.customGenres=DATA.customGenres||[];
function normStory(s){
  s.portada=s.portada||''; s.premisa=s.premisa||''; s.generos=s.generos||[]; s.estado=s.estado||'Idea';
  s.tipo=s.tipo||'One-shot'; s.notas=s.notas||''; s.favorita=!!s.favorita; s.archivada=!!s.archivada;
  s.relaciones=s.relaciones||[]; s.world=s.world||{mundo:'',poder:'',escala:''}; s.events=s.events||[]; s.chars=s.chars||[];
  return s;
}
DATA.stories=DATA.stories.map(normStory);
const GENEROS_BASE=['Horror','Thriller','Acción','Romance','Fantasía','Shonen','Seinen'];
const ESTADOS=['Idea','En desarrollo','Guion','Finalizado','Pausado'];
const TIPOS=['One-shot','Serie','Otro'];
const RELTIPOS=['Amigo','Enemigo','Rival','Hermano','Mentor','Pareja','Otro'];
const MAX_STORIES=17, MAX_CHARS=30;
let state = {tab:'tablero', storyId:null, sub:'info', editChar:null, search:'', fGeneros:[], fEstados:[], fTipos:[], showArchived:false, showNewForm:false};
function save(){
  const s0=document.getElementById('saveStatus'); if(s0) s0.textContent='Guardando...';
  localStorage.setItem('emk_data', JSON.stringify(DATA));
  setTimeout(()=>{const e=document.getElementById('saveStatus'); if(e) e.textContent = navigator.onLine===false?'Sin conexión / pendiente de guardar':'Guardado';},200);
}
window.addEventListener('offline',()=>{const e=document.getElementById('saveStatus');if(e)e.textContent='Sin conexión / pendiente de guardar';});
window.addEventListener('online',()=>{const e=document.getElementById('saveStatus');if(e)e.textContent='Guardado';});

// ---- Conexión directa con las APIs de IA (Anthropic/Claude y Google/Gemini) ----
function stripJsonFence(t){return t.replace(/^```json/i,'').replace(/^```/,'').replace(/```\s*$/,'').trim();}
function activeProvider(){return localStorage.getItem('emk_ai_provider')||'anthropic';}
function systemInstructionText(){return (localStorage.getItem('emk_system_instruction')||'').trim();}
async function callAnthropic(messages,systemPrompt){
  const key=(localStorage.getItem('emk_api_key')||'').trim();
  const model=(localStorage.getItem('emk_api_model')||'').trim()||'claude-sonnet-4-6';
  if(!key) return null;
  const body={model,max_tokens:3000,messages};
  if(systemPrompt) body.system=systemPrompt;
  const resp=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify(body)
  });
  if(!resp.ok){const t=await resp.text().catch(()=>'');throw new Error('Error de API de Claude ('+resp.status+'). Revisa tu clave en ⚙ Configuración.'+(t?' '+t.slice(0,150):''));}
  const data=await resp.json();
  return (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
}
function toGeminiContents(messages){
  return messages.map(m=>({
    role: m.role==='assistant'?'model':'user',
    parts: m.content.map(c=>c.type==='image'
      ? {inline_data:{mime_type:c.source.media_type,data:c.source.data}}
      : {text:c.text})
  }));
}
async function callGemini(messages,systemPrompt){
  const key=(localStorage.getItem('emk_gemini_key')||'').trim();
  const model=(localStorage.getItem('emk_gemini_model')||'').trim()||'gemini-2.5-flash';
  if(!key) return null;
  const body={contents:toGeminiContents(messages)};
  if(systemPrompt) body.systemInstruction={parts:[{text:systemPrompt}]};
  let resp;
  try{
    resp=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,{
      method:'POST',
      headers:{'content-type':'application/json','x-goog-api-key':key},
      body:JSON.stringify(body)
    });
  }catch(networkErr){
    if(navigator.onLine===false){
      throw new Error('Parece que no tienes conexión a internet ahora mismo. Revisa tu red e intenta de nuevo.');
    }
    throw new Error('No llegó respuesta de Gemini. Por seguridad, el navegador no muestra el motivo exacto cuando esto pasa, pero normalmente significa: tu clave de API es inválida o tiene restricciones de aplicación/dominio activadas, el proyecto de Google Cloud no tiene habilitada la "Generative Language API", o una extensión/red está bloqueando la petición. Revisa tu clave en aistudio.google.com/apikey.');
  }
  if(!resp.ok){const t=await resp.text().catch(()=>'');throw new Error('Error de API de Gemini ('+resp.status+'). Revisa tu clave en ⚙ Configuración.'+(t?' '+t.slice(0,150):''));}
  const data=await resp.json();
  const parts=data.candidates?.[0]?.content?.parts||[];
  return parts.map(p=>p.text||'').join('\n').trim();
}
async function getSample(){
  const prov=activeProvider();
  const key=(prov==='gemini'?localStorage.getItem('emk_gemini_key'):localStorage.getItem('emk_api_key'))||'';
  if(!key.trim()) return null;
  return {
    limits: async()=>({images:true}),
    json: async(messages,systemPrompt)=>{
      const text=prov==='gemini'?await callGemini(messages,systemPrompt):await callAnthropic(messages,systemPrompt);
      return JSON.parse(stripJsonFence(text));
    }
  };
}

// ==================== ARQUITECTURA DE AGENTES DE IA ====================
// AGENTE BASE + CONTEXTO DE MÓDULO + CONTEXTO DE TAREA + MODO ESPECÍFICO + DATOS DEL PROYECTO
// Cada llamada de IA se identifica con MODULE / TASK / MODE, definidos explícitamente por
// la interfaz (nunca inferidos desde el texto del usuario), y se combinan en un único
// system prompt: basePrompt + modulePrompt + taskPrompt + modePrompt + instrucción del autor.

const basePrompt=`Eres un asistente de IA integrado en "Estudio del Mangaka", una aplicación de creación de manga digital.
Reglas globales que debes seguir siempre, sin importar el módulo, tarea o modo desde el que se te invoque:
- Ayudas al autor como asistente profesional; el autor toma siempre las decisiones creativas finales, tú solo propones.
- Diferencia siempre entre hechos (lo que el proyecto ya establece), observaciones (lo que notas en el material entregado), sugerencias (posibilidades a considerar) y opiniones (tu valoración personal). No mezcles estas categorías.
- Nunca inventes información que no esté presente en los datos del proyecto o el material entregado. Si falta información relevante para responder bien, dilo explícitamente en vez de rellenar huecos.
- Utiliza siempre el contexto del proyecto que se te entregue en el mensaje.
- Evita repetir información innecesariamente.

- Tú nunca modificas, eliminas ni sobrescribes información del usuario: solo analizas y sugieres. Cualquier cambio a los datos lo hace el autor manualmente en la interfaz.`;

const TASK_PROMPTS={
  PREMISE_ANALYSIS:`TASK: PREMISE_ANALYSIS

  ARTE:`MODE: ARTE
Actúa como director artístico especializado en manga. Prioriza: composición, anatomía, perspectiva, profundidad, valores, iluminación, fondos, poses, siluetas, jerarquía visual, claridad de acción y lenguaje de planos. No conviertas preferencias estilísticas del autor en errores objetivos.`,

  GUION:`MODE: GUION
Actúa como editor de guion especializado en manga. Prioriza: diálogos, subtexto, exposición, caracterización, conflicto, ritmo, progresión dramática, redundancias, naturalidad, y qué información se transmite mediante texto frente a imagen.`
};

// Combina basePrompt + modulePrompt + taskPrompt + modePrompt + instrucción personalizada del autor.
// {module, task, mode} deben venir siempre indicados explícitamente por quien llama (nunca inferidos del texto del usuario).
function buildSystemPrompt({module,task,mode}={}){
  const parts=[basePrompt];
  if(module && MODULE_PROMPTS[module]) parts.push(MODULE_PROMPTS[module]);
  if(task && TASK_PROMPTS[task]) parts.push(TASK_PROMPTS[task]);
  if(mode && MODE_PROMPTS[mode]) parts.push(MODE_PROMPTS[mode]);
  const custom=systemInstructionText();
  if(custom) parts.push(`INSTRUCCIONES ADICIONALES DEL AUTOR (se aplican encima de todo lo anterior, en cualquier módulo): ${custom}`);
  return parts.join('\n\n');
}

function buildBetaReaderContext({bLinkStory,notesVal,anns,scopeNote,aspectos}){
  let ctx=`AVAILABLE_DATA:
Aspectos priorizados por el autor: ${aspectos}
${scopeNote}
Contexto/notas del autor: ${notesVal||'(sin notas)'}`;
  if(bLinkStory){
    const st=DATA.stories.find(s=>s.id==bLinkStory);
    if(st) ctx+=`\nHistoria vinculada: ${st.name}\nMundo: ${st.world.mundo||'—'}\nSistema de poder: ${st.world.poder||'—'}\nEscala de clases: ${st.world.escala||'—'}\nPersonajes:\n`+st.chars.map(c=>`- Rol: ${c.rol||'—'} | Descripción: ${c.desc||'—'} | Habilidades: ${c.habilidades||'—'}`).join('\n');
  }
  if(anns) ctx+=`\nAnotaciones del autor sobre páginas específicas:\n${anns}`;

function buildPuenteContext({objetivo,plataforma,formato,contexto}={}){
  let ctx=`AVAILABLE_DATA:\n${personalityLine()}`;
  if(objetivo) ctx+=`\nObjetivo: ${objetivo}.`;
  if(plataforma) ctx+=` Plataforma: ${plataforma} (respeta sus convenciones de formato/duración).`;
  if(formato) ctx+=` Formato: ${formato}.`;
  ctx+=`\nContexto del autor: ${contexto||'(sin contexto)'}`;
  return ctx;
}

function renderLibrary(){
  const wrap=el('<div></div>');

  // Ideas rápidas
  const ideasCard=el('<div class="card"></div>');
  ideasCard.appendChild(el('<h3>Ideas rápidas</h3>'));
  DATA.ideas.forEach(idea=>{
    const row=el(`<div class="ideacard"><span>${idea.texto}</span></div>`);
    const conv=el('<button class="ghost">Convertir en historia</button>');
    conv.onclick=()=>{
      if(DATA.stories.length>=MAX_STORIES){alert('Llegaste al límite de 17 historias.');return;}
      const s=normStory({id:Date.now(),name:idea.texto.slice(0,40)||'Nueva historia',premisa:idea.texto});
      DATA.stories.push(s);DATA.ideas=DATA.ideas.filter(i=>i.id!==idea.id);save();state.storyId=s.id;state.sub='info';render();
    };
    const del=el('<button class="ghost">✕</button>');
    del.onclick=()=>{DATA.ideas=DATA.ideas.filter(i=>i.id!==idea.id);save();render();};
    row.appendChild(conv);row.appendChild(del);
    ideasCard.appendChild(row);
  });
  const addIdeaRow=el('<div class="row"></div>');
  const ideaIn=el('<input type="text" placeholder="Anota una idea suelta..." style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);">');
  const addIdeaBtn=el('<button>+ Guardar idea</button>');
  addIdeaBtn.onclick=()=>{if(!ideaIn.value.trim())return;DATA.ideas.push({id:Date.now(),texto:ideaIn.value.trim()});save();render();};
  addIdeaRow.appendChild(ideaIn);addIdeaRow.appendChild(addIdeaBtn);
  ideasCard.appendChild(addIdeaRow);
  wrap.appendChild(ideasCard);

  // Buscador y filtros
  const topCard=el('<div class="card"></div>');
  const headRow=el('<div class="row" style="justify-content:space-between;"><h3>Tus historias</h3></div>');
  const newBtn=el(`<button ${DATA.stories.length>=MAX_STORIES?'disabled':''}>+ Nueva historia</button>`);
  newBtn.onclick=()=>{state.showNewForm=!state.showNewForm;render();};
  headRow.appendChild(newBtn);
  topCard.appendChild(headRow);
  if(DATA.stories.length>=MAX_STORIES) topCard.appendChild(el('<p class="small">Límite de 17 historias alcanzado.</p>'));

  if(state.showNewForm) topCard.appendChild(renderNewStoryForm());

  const search=el(`<input class="searchbar" type="text" placeholder="Buscar por nombre o premisa..." value="${state.search}">`);
  search.oninput=()=>{state.search=search.value;redrawGrid();};
  topCard.appendChild(search);

  const allGeneros=[...new Set([...GENEROS_BASE,...DATA.customGenres])];
  topCard.appendChild(el('<label>Género</label>'));
  const gBar=el('<div class="filterbar"></div>');
  allGeneros.forEach(g=>{
    const b=el(`<button class="${state.fGeneros.includes(g)?'on':''}">${g}</button>`);
    b.onclick=()=>{state.fGeneros=state.fGeneros.includes(g)?state.fGeneros.filter(x=>x!==g):[...state.fGeneros,g];b.classList.toggle('on');redrawGrid();};
    gBar.appendChild(b);
  });
  topCard.appendChild(gBar);
  topCard.appendChild(el('<label>Estado</label>'));
  const eBar=el('<div class="filterbar"></div>');
  ESTADOS.forEach(g=>{
    const b=el(`<button class="${state.fEstados.includes(g)?'on':''}">${g}</button>`);
    b.onclick=()=>{state.fEstados=state.fEstados.includes(g)?state.fEstados.filter(x=>x!==g):[...state.fEstados,g];b.classList.toggle('on');redrawGrid();};
    eBar.appendChild(b);
  });
  topCard.appendChild(eBar);
  topCard.appendChild(el('<label>Tipo</label>'));
  const tBar=el('<div class="filterbar"></div>');
  TIPOS.forEach(g=>{
    const b=el(`<button class="${state.fTipos.includes(g)?'on':''}">${g}</button>`);
    b.onclick=()=>{state.fTipos=state.fTipos.includes(g)?state.fTipos.filter(x=>x!==g):[...state.fTipos,g];b.classList.toggle('on');redrawGrid();};
    tBar.appendChild(b);
  });
  topCard.appendChild(tBar);
  const archLbl=el(`<label style="display:flex;gap:6px;align-items:center;font-weight:400;"><input type="checkbox" ${state.showArchived?'checked':''}>Mostrar archivadas</label>`);
  archLbl.querySelector('input').onchange=(e)=>{state.showArchived=e.target.checked;redrawGrid();};
  topCard.appendChild(archLbl);

  const grid=el('<div class="libgrid"></div>');
  function redrawGrid(){
    grid.innerHTML='';
    let list=DATA.stories.filter(s=>state.showArchived||!s.archivada);
    if(state.search) list=list.filter(s=>(s.name+' '+s.premisa).toLowerCase().includes(state.search.toLowerCase()));
    if(state.fGeneros.length) list=list.filter(s=>s.generos.some(g=>state.fGeneros.includes(g)));
    if(state.fEstados.length) list=list.filter(s=>state.fEstados.includes(s.estado));
    if(state.fTipos.length) list=list.filter(s=>state.fTipos.includes(s.tipo));
    list.sort((a,b)=>(b.favorita-a.favorita));
    list.forEach(s=>grid.appendChild(renderStoryCard(s)));
    if(!list.length) grid.appendChild(el('<p class="small">No hay historias que coincidan.</p>'));
  }
  topCard.appendChild(grid);
  redrawGrid();
  wrap.appendChild(topCard);
  return wrap;
}

  card.querySelector('.cover').onclick=card.querySelector('.body').onclick=()=>{state.storyId=s.id;state.sub='info';render();};
  const acts=el('<div class="cardacts"></div>');
  const fav=el('<button class="ghost">'+(s.favorita?'★ Quitar':'☆ Favorita')+'</button>');
  fav.onclick=(e)=>{e.stopPropagation();s.favorita=!s.favorita;save();render();};
  const dup=el('<button class="ghost">Duplicar</button>');
  dup.onclick=(e)=>{e.stopPropagation();if(DATA.stories.length>=MAX_STORIES){alert('Límite de 17 historias.');return;}const c=JSON.parse(JSON.stringify(s));c.id=Date.now();c.name=s.name+' (copia)';c.favorita=false;DATA.stories.push(c);save();render();};
  const arch=el('<button class="ghost">'+(s.archivada?'Desarchivar':'Archivar')+'</button>');
  arch.onclick=(e)=>{e.stopPropagation();s.archivada=!s.archivada;save();render();};
  const del=el('<button class="ghost">Eliminar</button>');
  del.onclick=(e)=>{e.stopPropagation();if(confirm(`¿Eliminar "${s.name}" y todos sus datos? Esta acción no se puede deshacer.`)){DATA.stories=DATA.stories.filter(x=>x.id!==s.id);save();render();}};
  acts.appendChild(fav);acts.appendChild(dup);acts.appendChild(arch);acts.appendChild(del);
  card.appendChild(acts);
  return card;
}

// ---- Fotos de personaje en alta calidad: el original se guarda en IndexedDB (la miniatura sigue en localStorage) ----
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('emk_imgs',1);r.onupgradeneeded=()=>r.result.createObjectStore('i');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbPut(k,v){try{const d=await idbOpen();await new Promise((res,rej)=>{const t=d.transaction('i','readwrite');t.objectStore('i').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error);});return true;}catch(e){return false;}}
async function idbGet(k){try{const d=await idbOpen();return await new Promise((res,rej)=>{const q=d.transaction('i').objectStore('i').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}catch(e){return null;}}
const photoMem=new Map(); // originales de esta sesión (disponibles al instante, sin esperar a IndexedDB)
async function idbDel(k){try{const d=await idbOpen();await new Promise(res=>{const t=d.transaction('i','readwrite');t.objectStore('i').delete(k);t.oncomplete=t.onerror=res;});}catch(e){}}
// Visor a pantalla completa: usa el ORIGINAL guardado (alta calidad), con zoom (botones, rueda, pellizco, doble toque) y desplazamiento.
const prLoadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('img'));i.src=src;});
const prReadData=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(f);});
async function openPhoto(ch){
  const v=el('<div class="pviewer"><div class="pvtop"><button data-a="out">－</button><button data-a="in">＋</button><button data-a="fit">Ajustar</button><button data-a="full">100%</button><span class="pvinfo"></span><button data-a="x" style="margin-left:auto">✕ Cerrar</button></div><div class="pvscroll"><div class="pvwrap"><span class="pvload">Cargando imagen en alta calidad…</span></div></div></div>');
  const sc=v.querySelector('.pvscroll'),wr=v.querySelector('.pvwrap'),info=v.querySelector('.pvinfo');
  let blobUrl=null,z=1,img=null;
  const onKey=e=>{if(e.key==='Escape')close();},onRes=()=>apply();
  const close=()=>{document.removeEventListener('keydown',onKey);window.removeEventListener('resize',onRes);if(blobUrl)URL.revokeObjectURL(blobUrl);v.remove();};
  document.addEventListener('keydown',onKey);window.addEventListener('resize',onRes);
  v.querySelector('[data-a=x]').onclick=close;
  sc.onclick=e=>{if(e.target===sc||e.target===wr)close();};
  document.body.appendChild(v);
  const fitW=()=>Math.min(sc.clientWidth/img.naturalWidth,sc.clientHeight/img.naturalHeight)*img.naturalWidth;
  function apply(){if(img)img.style.width=Math.max(20,fitW()*z)+'px';}
  function setZ(nz){const rx=(sc.scrollLeft+sc.clientWidth/2)/Math.max(wr.scrollWidth,1),ry=(sc.scrollTop+sc.clientHeight/2)/Math.max(wr.scrollHeight,1);z=Math.min(12,Math.max(1,nz));apply();sc.scrollLeft=rx*wr.scrollWidth-sc.clientWidth/2;sc.scrollTop=ry*wr.scrollHeight-sc.clientHeight/2;}
  let hi=false,origFailed=false;
  try{
    // 1) Original (alta calidad): primero como blob; si el navegador/entorno bloquea blob:, se reintenta como data:
    let f=null;
    if(ch.photoKey){f=photoMem.get(ch.photoKey);if(!f)f=await idbGet(ch.photoKey);}
    if(f&&typeof f==='object'&&f.size){
      try{blobUrl=URL.createObjectURL(f);img=await prLoadImg(blobUrl);hi=true;}catch(e){img=null;}
      if(!img){try{img=await prLoadImg(await prReadData(f));hi=true;}catch(e){img=null;}}
      if(!img)origFailed=true;
    }
    // 2) Miniatura guardada (baja resolución) como último recurso
    if(!img&&ch.photo){try{img=await prLoadImg(ch.photo);}catch(e){img=null;}}
  }catch(e){img=null;}
  if(!v.isConnected)return;
  if(!img){wr.innerHTML='<span class="pvload">No se pudo cargar la imagen. Súbela de nuevo con «Cambiar / subir foto».</span>';return;}
  const nw=img.naturalWidth;
  wr.innerHTML='';wr.appendChild(img);apply();
  info.style.color=hi?'#cfe':'#fc9';
  info.textContent=hi?nw+'×'+img.naturalHeight+' px · original':(origFailed?'No se pudo abrir el original (formato no compatible con este navegador); se muestra la miniatura.':'Foto guardada en baja resolución ('+nw+' px). Súbela de nuevo con «Cambiar / subir foto» para verla en alta calidad.');
  v.querySelector('[data-a=in]').onclick=()=>setZ(z*1.4);
  v.querySelector('[data-a=out]').onclick=()=>setZ(z/1.4);
  v.querySelector('[data-a=fit]').onclick=()=>setZ(1);
  v.querySelector('[data-a=full]').onclick=()=>setZ(nw/fitW());
  img.ondblclick=()=>setZ(z>1.05?1:Math.max(2.5,nw/fitW()));
  sc.addEventListener('wheel',e=>{e.preventDefault();setZ(z*(e.deltaY<0?1.15:1/1.15));},{passive:false});
  let d0=0;
  sc.addEventListener('touchstart',e=>{if(e.touches.length===2)d0=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);},{passive:true});
  sc.addEventListener('touchmove',e=>{if(e.touches.length===2&&d0){e.preventDefault();const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);setZ(z*d/d0);d0=d;}},{passive:false});
}

function renderPersonajes(story){
  const wrap=el('<div></div>');
  const editing = state.editChar!==null ? story.chars.find(c=>c.id===state.editChar) : null;
  if(editing || state.editChar==='new'){
    const ch = editing || {id:Date.now(),photo:'',nombre:'',edad:'',descPersonalidad:'',rol:'',habilidadesDebilidades:'',motivacionesObjetivos:'',notas:''};
    const card=el('<div class="card"></div>');
    card.appendChild(el('<label>Foto del personaje</label>'));
    const pbox=el(`<div class="photobox">${ch.photo?`<img src="${ch.photo}">`:'<span class="small">Toca para subir foto</span>'}</div>`);
    const finput=el('<input type="file" accept="image/*" style="display:none">');
    pbox.style.cursor=ch.photo?'zoom-in':'pointer';
    pbox.onclick=()=>{ if(ch.photo) openPhoto(ch); else finput.click(); };
    finput.onchange=()=>{ const f=finput.files[0]; if(!f) return;
      const oldKey=ch.photoKey;
      ch.photoKey='ph'+Date.now()+Math.random().toString(36).slice(2,6);
      photoMem.set(ch.photoKey,f);
      idbPut(ch.photoKey,f);
      if(oldKey){photoMem.delete(oldKey);idbDel(oldKey);}
      compressImg(f, u=>{ch.photo=u;pbox.innerHTML=`<img src="${u}">`;});
      finput.value='';
    };
    card.appendChild(pbox);card.appendChild(finput);
    const chg=el('<button type="button" class="ghost" style="display:block;margin:6px auto 0;font-size:12px;">Cambiar / subir foto</button>');
    chg.onclick=()=>finput.click();
    card.appendChild(chg);
    card.appendChild(el('<div class="small" style="text-align:center;margin-top:4px;">Toca la imagen para verla en grande</div>'));

    card.appendChild(el('<label>Nombre</label>'));
    const nomIn=el(`<input type="text" value="${ch.nombre}" style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);">`);card.appendChild(nomIn);
    card.appendChild(el('<label>Edad (opcional)</label>'));
    const edadIn=el(`<input type="text" value="${ch.edad}" style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);">`);card.appendChild(edadIn);
    card.appendChild(el('<label>Descripción y personalidad</label>'));
    const descT=el(`<textarea>${ch.descPersonalidad||ch.desc||''}</textarea>`);card.appendChild(descT);
    card.appendChild(el('<label>Rol en la historia</label>'));
    const rolT=el(`<textarea>${ch.rol}</textarea>`);card.appendChild(rolT);
    card.appendChild(el('<label>Habilidades y debilidades</label>'));
    const habT=el(`<textarea>${ch.habilidadesDebilidades||ch.habilidades||''}</textarea>`);card.appendChild(habT);
    card.appendChild(el('<label>Motivaciones y objetivos</label>'));
    const motT=el(`<textarea>${ch.motivacionesObjetivos||''}</textarea>`);card.appendChild(motT);
    card.appendChild(el('<label>Notas clave</label>'));
    const notT=el(`<textarea>${ch.notas}</textarea>`);card.appendChild(notT);

    const rels=story.relaciones.filter(r=>r.a===ch.id||r.b===ch.id);
    if(rels.length){
      card.appendChild(el('<label>Relaciones</label>'));
      const relBox=el('<div class="small"></div>');
      rels.forEach(r=>{const other=story.chars.find(c=>c.id===(r.a===ch.id?r.b:r.a));relBox.appendChild(el(`<div>${r.tipo} — ${other?other.nombre:'(personaje eliminado)'}${r.desc?': '+r.desc:''}</div>`));});
      card.appendChild(relBox);
    }

    const btns=el('<div class="row" style="margin-top:10px;"></div>');
    const saveBtn=el('<button>Guardar personaje</button>');
    saveBtn.onclick=()=>{
      ch.nombre=nomIn.value;ch.edad=edadIn.value;ch.descPersonalidad=descT.value;ch.rol=rolT.value;ch.habilidadesDebilidades=habT.value;ch.motivacionesObjetivos=motT.value;ch.notas=notT.value;
      if(!editing){
        if(story.chars.length>=MAX_CHARS){alert('Límite de 30 personajes por historia.');return;}
        story.chars.push(ch);
      }
      save();state.editChar=null;render();
    };
    const cancelBtn=el('<button class="ghost">Cancelar</button>');
    cancelBtn.onclick=()=>{state.editChar=null;render();};
    btns.appendChild(saveBtn);btns.appendChild(cancelBtn);
    if(editing){
      const dupBtn=el('<button class="ghost">Duplicar</button>');
      dupBtn.onclick=()=>{if(story.chars.length>=MAX_CHARS){alert('Límite de 30 personajes.');return;}const c={...ch,id:Date.now(),nombre:ch.nombre+' (copia)'};story.chars.push(c);save();state.editChar=c.id;render();};
      const delBtn=el('<button class="ghost">Eliminar</button>');
      delBtn.onclick=()=>{if(confirm('¿Eliminar este personaje?')){story.chars=story.chars.filter(c=>c.id!==ch.id);story.relaciones=story.relaciones.filter(r=>r.a!==ch.id&&r.b!==ch.id);save();state.editChar=null;render();}};
      btns.appendChild(dupBtn);btns.appendChild(delBtn);
      const others=DATA.stories.filter(s=>s.id!==story.id);
      if(others.length){
        const mvSel=el('<select style="margin-left:4px;"></select>');
        mvSel.appendChild(el('<option value="">Mover a...</option>'));
        others.forEach(s=>mvSel.appendChild(el(`<option value="${s.id}">${s.name}</option>`)));
        mvSel.onchange=()=>{
          const target=DATA.stories.find(s=>s.id==mvSel.value);
          if(target){
            if(target.chars.length>=MAX_CHARS){alert('Esa historia ya tiene 30 personajes.');return;}
            story.chars=story.chars.filter(c=>c.id!==ch.id);
            story.relaciones=story.relaciones.filter(r=>r.a!==ch.id&&r.b!==ch.id);
            target.chars.push(ch);save();state.editChar=null;render();
          }
        };
        btns.appendChild(mvSel);
      }
    }
    card.appendChild(btns);
    if(editing){
      const aiBtn=el('<button class="ghost" style="margin-top:8px;">✦ Analizar personaje</button>');
      const aiRes=el('<div></div>');
      aiBtn.onclick=()=>analyzeCharAI(ch,story,aiRes);
      card.appendChild(aiBtn);card.appendChild(aiRes);
    }
    wrap.appendChild(card);
    return wrap;
  }

  const addBtn=el(`<button style="margin-bottom:10px;" ${story.chars.length>=MAX_CHARS?'disabled':''}>+ Añadir personaje</button>`);
  addBtn.onclick=()=>{state.editChar='new';render();};
  wrap.appendChild(addBtn);
  if(story.chars.length>=MAX_CHARS) wrap.appendChild(el('<p class="small">Límite de 30 personajes alcanzado.</p>'));
  story.chars.forEach(c=>{
    const card=el(`<div class="charcard">${c.photo?`<img src="${c.photo}">`:'<div class="ph"></div>'}<div><span class="charname">${c.nombre||'Sin nombre'}</span>${c.edad?' · '+c.edad:''}<div class="small">${c.rol||''}</div></div></div>`);
    card.onclick=()=>{state.editChar=c.id;render();};
    wrap.appendChild(card);
  });
  if(!story.chars.length) wrap.appendChild(el('<p class="small">Todavía no hay personajes en esta historia.</p>'));
  return wrap;
}

function renderRelaciones(story){
  const wrap=el('<div></div>');
  if(story.chars.length<2){wrap.appendChild(el('<p class="small">Necesitas al menos 2 personajes para crear relaciones.</p>'));return wrap;}
  // mapa visual simple
  const n=story.chars.length, cx=150, cy=105, R=80;
  const pts=story.chars.map((c,i)=>({c,x:cx+R*Math.cos(2*Math.PI*i/n-Math.PI/2),y:cy+R*Math.sin(2*Math.PI*i/n-Math.PI/2)}));
  let svg=`<svg class="relnet" viewBox="0 0 300 210" xmlns="http://www.w3.org/2000/svg">`;
  story.relaciones.forEach(r=>{
    const pa=pts.find(p=>p.c.id===r.a), pb=pts.find(p=>p.c.id===r.b);
    if(pa&&pb) svg+=`<line x1="${pa.x}" y1="${pa.y}" x2="${pb.x}" y2="${pb.y}" stroke="var(--accent)" stroke-width="1.5"/><text x="${(pa.x+pb.x)/2}" y="${(pa.y+pb.y)/2}" font-size="8" fill="var(--sub)" text-anchor="middle">${r.tipo}</text>`;
  });
  pts.forEach(p=>{svg+=`<circle cx="${p.x}" cy="${p.y}" r="16" fill="var(--panel)" stroke="var(--accent)" stroke-width="2"/><text x="${p.x}" y="${p.y+3}" font-size="8" fill="var(--ink)" text-anchor="middle">${(p.c.nombre||'?').slice(0,6)}</text>`;});
  svg+='</svg>';
  wrap.appendChild(el(svg));

  story.relaciones.forEach((r,i)=>{
    const a=story.chars.find(c=>c.id===r.a), b=story.chars.find(c=>c.id===r.b);
    const row=el(`<div class="relrow"><span>${a?a.nombre:'?'}</span><span>—</span><span>${r.tipo}</span><span>—</span><span>${b?b.nombre:'?'}</span>${r.desc?`<span class="small">(${r.desc})</span>`:''}</div>`);
    const del=el('<button class="ghost">✕</button>');
    del.onclick=()=>{story.relaciones.splice(i,1);save();render();};
    row.appendChild(del);
    wrap.appendChild(row);
  });

  const form=el('<div class="relrow"></div>');

function compressImg(file,cb,max=500,quality=0.75){
  const r=new FileReader();
  r.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>h&&w>max){h*=max/w;w=max;} else if(h>max){w*=max/h;h=max;}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg',quality));
      c.width=0;c.height=0;
    };
    img.src=e.target.result;
  };
  r.readAsDataURL(file);
}

// ---- Visor (zoom, pantalla completa, anotaciones, navegación por miniaturas) ----
function openViewer(idx){betaViewerIdx=idx;betaScale=1;renderViewer();}
function closeViewer(){document.getElementById('betaViewerEl')?.remove();betaViewerIdx=null;}
function renderViewer(){
  document.getElementById('betaViewerEl')?.remove();
  const p=betaPages[betaViewerIdx];if(!p)return;
  const v=el('<div class="viewer" id="betaViewerEl"></div>');
  const top=el('<div class="vtop"></div>');
  const mk=(t,fn)=>{const b=el(`<button>${t}</button>`);b.onclick=fn;top.appendChild(b);};
  mk('✕ Cerrar',closeViewer);
  mk('－',()=>{betaScale=Math.max(.5,betaScale-.25);img.style.width=(betaScale*100)+'%';});
  mk('＋',()=>{betaScale=Math.min(3,betaScale+.25);img.style.width=(betaScale*100)+'%';});
  mk('Pantalla completa',()=>{v.requestFullscreen?.();});
  mk('◀',()=>{if(betaViewerIdx>0){betaViewerIdx--;betaScale=1;renderViewer();}});
  mk('▶',()=>{if(betaViewerIdx<betaPages.length-1){betaViewerIdx++;betaScale=1;renderViewer();}});
  v.appendChild(top);
  const imgwrap=el('<div class="vimgwrap"></div>');
  const inner=el('<div class="inner"></div>');
  const img=el(`<img src="${p.url}" style="width:100%;">`);
  inner.appendChild(img);
  p.annotations.forEach((a,ai)=>{
    const dot=el(`<div class="dot" style="left:${a.x}%;top:${a.y}%;" title="${a.text.replace(/"/g,'&quot;')}">${ai+1}</div>`);
    dot.onclick=(e)=>{e.stopPropagation();if(confirm('Anotación: '+a.text+'\n\n¿Eliminar esta anotación?')){p.annotations.splice(ai,1);renderViewer();}};
    inner.appendChild(dot);
  });
  imgwrap.appendChild(inner);
  imgwrap.onclick=(e)=>{
    if(e.target!==img)return;
    const r=img.getBoundingClientRect();
    const x=((e.clientX-r.left)/r.width*100).toFixed(1), y=((e.clientY-r.top)/r.height*100).toFixed(1);
    const text=prompt('Comentario para esta anotación:');
    if(text){p.annotations.push({x,y,text});renderViewer();}
  };
  v.appendChild(imgwrap);
  const strip=el('<div class="thumbstrip"></div>');
  betaPages.forEach((pp,i)=>{
    const th=el(`<img src="${pp.thumb||''}" class="${i===betaViewerIdx?'active':''}">`);
    th.onclick=()=>{betaViewerIdx=i;betaScale=1;renderViewer();};
    strip.appendChild(th);
  });
  v.appendChild(strip);
  document.body.appendChild(v);
}
function openCompare(i1,i2){
  document.getElementById('betaViewerEl')?.remove();

  const close=el('<button>✕ Cerrar</button>');close.onclick=()=>v.remove();top.appendChild(close);

}

// ================= PRODUCCIÓN (4ª pestaña) =================
DATA.prod=DATA.prod||{projects:[],active:null,main:null,running:null};
const P_ETAPAS=['Guion','Storyboard','Boceto','Lineart','Fondos','Tonos','Lettering','Correcciones','Finalización'];
const P_DIAS=[['L',1],['M',2],['X',3],['J',4],['V',5],['S',6],['D',0]];
const P_FB=20; // minutos por etapa cuando aún no hay historial (estimación)
let pr={v:'panel',cal:'semana',anchor:null,edit:null,sel:null,pg:null,hoy:null,plan:null,started:false};
const pIso=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const pToday=()=>pIso(Date.now());
const pDt=s=>new Date(s+'T12:00:00');
const pAdd=(s,n)=>{const d=pDt(s);d.setDate(d.getDate()+n);return pIso(d);};
const pDiff=(a,b)=>Math.round((pDt(b)-pDt(a))/864e5);
const pWork=(p,s)=>p.dias.includes(pDt(s).getDay());
const pWorkN=(p,a,b)=>{let n=0;for(let s=a;s<=b;s=pAdd(s,1))if(pWork(p,s))n++;return n;};
const pFm=m=>{if(m==null)return '—';m=Math.round(m);return m>=60?Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m':m+'m';};
const pNum=n=>n==null?'—':(Math.round(n*100)/100).toString().replace('.',',');
const pDate=s=>s?pDt(s).toLocaleDateString('es-CL',{day:'numeric',month:'short'}):'—';
const pClk=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/3600)+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
const pLbl=g=>g.length>1?`Págs ${g[0]}–${g[g.length-1]}`:`Pág ${g[0]}`;
const PP=()=>DATA.prod.projects.find(x=>x.id===DATA.prod.active)||DATA.prod.projects[0];
const storyOf=p=>DATA.stories.find(s=>s.id==p.storyId);
const pgDone=(p,g)=>p.etapas.length>0&&p.etapas.every(e=>g.st[e]);
const pgProg=(p,g)=>p.etapas.length?p.etapas.filter(e=>g.st[e]).length/p.etapas.length:0;
const pgMin=(p,n)=>p.sessions.filter(x=>x.page===n).reduce((a,x)=>a+x.min,0);
const nextEtapa=(p,g)=>p.etapas.find(e=>!g.st[e]);
function pgEstado(p,g){if(g.bloq)return 'Bloqueada';if(g.obs>0)return 'Pendiente de corrección';if(pgDone(p,g))return 'Terminada';if(p.etapas.some(e=>g.st[e])||p.sessions.some(x=>x.page===g.n))return 'En progreso';return 'No iniciada';}
const newPage=n=>({n,st:{},obs:0,bloq:false,motivo:'',beta:false,promo:false,pin:false});

// ---- Director de Producción: única fuente de cálculo (la usa la interfaz y, a futuro, Manga Copilot) ----
function pCalc(p){
  const t=pToday(),gs=p.pages,total=gs.length,done=gs.filter(g=>pgDone(p,g)).length,rest=total-done;
  const wd=t>=p.inicio?pWorkN(p,p.inicio,t):0, real=done>0&&wd>0?done/wd:null;
  const wl=t>p.objetivo?0:pWorkN(p,t,p.objetivo), wle=Math.floor(wl*(1-p.buffer/100));
  const nec=rest>0&&wle>0?rest/wle:null;
  let est=null;
  if(rest===0)est=t; else if(real&&p.dias.length){let n=Math.ceil(rest/real),s=t;while(n>0){s=pAdd(s,1);if(pWork(p,s))n--;}est=s;}
  const S=p.sessions,SS=S.slice().sort((a,b)=>a.start<b.start?-1:1),totalMin=S.reduce((a,x)=>a+x.min,0);
  const ea={};
  p.etapas.forEach(e=>{const m=new Map();SS.filter(x=>x.etapa===e).forEach(x=>m.set(x.page,(m.get(x.page)||0)+x.min));const v=[...m.values()],tot=v.reduce((a,b)=>a+b,0);ea[e]={n:v.length,tot,avg:v.length?tot/v.length:null,series:v};});
  let rem=0,restEst=false;
  gs.forEach(g=>{if(pgDone(p,g))return;p.etapas.forEach(e=>{if(g.st[e])return;const a=ea[e].avg;if(a==null){rem+=P_FB;restEst=true;}else rem+=a;});});
  const dw=gs.filter(g=>pgDone(p,g)&&pgMin(p,g.n)>0), mpp=dw.length?dw.reduce((a,g)=>a+pgMin(p,g.n),0)/dw.length:null;
  const l5=SS.slice(-5);
  let atraso=0;
  if(p.plan&&p.plan.ppd){const ex=p.plan.items.filter(i=>i.d<t).flatMap(i=>i.pgs);atraso=ex.filter(n=>gs[n-1]&&!pgDone(p,gs[n-1])).length/p.plan.ppd;}
  const pri=gs.filter(g=>(!pgDone(p,g)||g.obs>0)&&!g.bloq).map(g=>{
    const r=[];let sc=0;
    if(g.pin){sc+=1000;r.push('la fijaste como prioridad');}
    if(g.obs>0){sc+=60;r.push(`tiene ${g.obs} observación(es) pendiente(s)`);}
    const pg=pgProg(p,g);if(pg>0&&!pgDone(p,g)){sc+=pg*40;r.push(`ya está avanzada (${Math.round(pg*100)}%) y terminarla reduce pendientes`);}
    const ne=nextEtapa(p,g);
    if(ne&&gs.some(h=>h.n>g.n&&!pgDone(p,h)&&h.st[ne])){sc+=30;r.push('páginas posteriores ya pasaron esa etapa y esta las frena');}
    sc+=(total-g.n)/total*10;if(!r.length)r.push('es la siguiente en el orden');
    return {g,sc,razon:r[0]};
  }).sort((a,b)=>b.sc-a.sc);
  return {proyecto:{id:p.id,nombre:p.name,historia:(storyOf(p)||{}).name||null,tipo:p.tipo},
    total,hechas:done,pendientes:rest,pct:total?done/total:0,ritmoReal:real,ritmoNecesario:nec,
    objetivo:p.objetivo,estimada:est,diffDias:est?pDiff(p.objetivo,est):null,
    minTotal:totalMin,minPorPagina:mpp,minHoy:S.filter(x=>x.date===t).reduce((a,x)=>a+x.min,0),
    minRestante:rem,restanteEstimado:restEst,ultimaSesion:SS.length?SS[SS.length-1].min:null,
    prom5:l5.length?l5.reduce((a,x)=>a+x.min,0)/l5.length:null,etapas:ea,atrasoDias:atraso,
    diasTrabajoRestantes:wl,diasProduccion:wle,
    prioridades:pri.slice(0,5).map(x=>({pagina:x.g.n,razon:x.razon})),
    bloqueos:gs.filter(g=>g.bloq).map(g=>({pagina:g.n,motivo:g.motivo})),_pri:pri};
}
function pHoy(p,c){
  const lim=p.horas*60,items=[];let tot=0,est=false;
  for(const x of c._pri){
    if(items.length>=6||(tot>=lim&&items.length))break;
    const g=x.g,cor=g.obs>0,e=cor&&p.etapas.includes('Correcciones')?'Correcciones':(nextEtapa(p,g)||p.etapas[p.etapas.length-1]);
    const a=e&&c.etapas[e]?c.etapas[e].avg:null,m=a==null?P_FB:a;if(a==null)est=true;
    items.push({n:g.n,txt:cor?`Corregir página ${g.n}`:`${e} de página ${g.n}`,min:m});tot+=m;
  }
  return {items,tot,est};
}
function pObs(p,c){
  const o=[],E=Object.entries(c.etapas).filter(([e,v])=>v.tot>0),T=E.reduce((a,[e,v])=>a+v.tot,0);
  if(E.length>=2){const [e,v]=E.slice().sort((a,b)=>b[1].tot-a[1].tot)[0];o.push(`${e} representa actualmente la mayor parte de tu tiempo de producción (${Math.round(v.tot/T*100)}%). Tu promedio es ${pFm(v.avg)} por página (${v.n} registradas).`);}
  E.forEach(([e,v])=>{const s=v.series;if(s.length>=6){const k=Math.min(8,Math.floor(s.length/2)),rc=s.slice(-k),pv=s.slice(0,-k),a=x=>x.reduce((q,z)=>q+z,0)/x.length,ch=(a(rc)-a(pv))/a(pv);if(Math.abs(ch)>=.2)o.push(`Durante las últimas ${k} páginas, el tiempo de ${e.toLowerCase()} ${ch>0?'aumentó':'disminuyó'} aproximadamente un ${Math.round(Math.abs(ch)*100)}% respecto a tu promedio anterior (observación: los datos no indican la causa).`);}});
  return o;
}
function pPlan(p,ppd,n){
  const list=p.pages.filter(g=>!pgDone(p,g)).map(g=>g.n).slice(0,n),items=[];
  if(!(ppd>0))return {ppd:0,gen:pToday(),items,fin:null};
  let s=pToday(),k=0,i=0,guard=0;
  while(i<list.length&&guard++<1500){if(pWork(p,s)){k++;const up=Math.min(list.length,Math.round(k*ppd));if(up>i){items.push({d:s,pgs:list.slice(i,up)});i=up;}}s=pAdd(s,1);}
  return {ppd,gen:pToday(),items,fin:items.length?items[items.length-1].d:null};
}
// Nunca cambia nada solo: siempre pide elegir.
function pReplan(p,msg,keepRate,L){
  const c=pCalc(p),rest=c.pendientes;L=L||['Recalcular manteniendo fecha','Recalcular manteniendo ritmo','Revisar manualmente'];
  const m=el(`<div class="viewer" style="background:rgba(0,0,0,.6);align-items:center;justify-content:center;"><div class="card" style="max-width:420px;margin:auto"><p>${msg}</p><div class="bx"></div></div></div>`),bx=m.querySelector('.bx');
  const opt=(t,fn)=>{const b=el(`<button class="ghost" style="display:block;width:100%;margin-bottom:6px;text-align:left">${t}</button>`);b.onclick=()=>{m.remove();fn();};bx.appendChild(b);};
  opt(L[0],()=>{if(!c.diasProduccion){alert('No quedan días de trabajo antes de la fecha objetivo.');render();return;}p.plan=pPlan(p,rest/c.diasProduccion,rest);save();render();});
  opt(L[1],()=>{const r=keepRate||c.ritmoReal||c.ritmoNecesario;if(!r){alert('Datos insuficientes para calcular esto.');render();return;}p.plan=pPlan(p,r,rest);save();render();});
  opt(L[2],()=>render());
  document.body.appendChild(m);
}
function pStop(){
  const D=DATA.prod,r=D.running;if(!r)return;
  const p=D.projects.find(x=>x.id===r.pid),end=Date.now(),min=(end-r.start)/60000;D.running=null;pr.hoy=null;
  if(p&&min>=0.5){
    p.sessions.push({id:end,date:pIso(r.start),start:new Date(r.start).toISOString(),end:new Date(end).toISOString(),min:Math.round(min*10)/10,page:r.page,etapa:r.etapa});
    const g=p.pages[r.page-1];
    if(g&&!g.st[r.etapa]&&confirm(`¿Marcar "${r.etapa}" de la página ${r.page} como terminada?`))g.st[r.etapa]=true;
  }
  save();render();
}

function pCal(p,c){
  const w=el('<div></div>'),t=pToday();
  const pl=el(`<div class="card"><h3>Planificador</h3><div class="row"><span>Quiero terminar</span><input id="plN" type="number" min="1" value="${Math.max(1,c.pendientes)}" style="width:70px"><span>páginas en</span><input id="plD" type="number" min="1" value="${Math.max(1,pDiff(t,p.objetivo)+1)}" style="width:70px"><span>días</span><button id="plB">Calcular</button></div><div id="plO" class="small" style="margin-top:8px"></div></div>`);
  const out=pl.querySelector('#plO');
  pl.querySelector('#plB').onclick=()=>{
    const n=Math.max(1,+pl.querySelector('#plN').value||1),D=Math.max(1,+pl.querySelector('#plD').value||1);
    const wn=pWorkN(p,t,pAdd(t,D-1)),eff=Math.floor(wn*(1-p.buffer/100));
    if(!eff){out.textContent='No hay suficientes días de trabajo en ese plazo.';return;}
    const plan=pPlan(p,n/eff,n),h=p.horas;
    out.innerHTML=`<b>${pNum(n/eff)} pág/día</b> · ${wn} días de trabajo<br>Tiempo planificado: ${pFm(wn*h*60)} · Tiempo de producción: ${pFm(eff*h*60)} · Buffer (${p.buffer}%): ${pFm((wn-eff)*h*60)}<br>Fecha estimada de término: ${pDate(plan.fin)}<br>Tiempo de trabajo estimado: ${pFm(c.minRestante)}${c.restanteEstimado?' (estimación aproximada: aún no hay historial suficiente)':' (según tu tiempo real)'}<div style="margin:6px 0">${plan.items.slice(0,12).map((i,k)=>`DÍA ${k+1} · ${pDate(i.d)}: ${pLbl(i.pgs)}`).join('<br>')}${plan.items.length>12?'<br>…':''}</div>`;
    const sv=el('<button>Guardar como calendario</button>');sv.onclick=()=>{p.plan=plan;save();render();};out.appendChild(sv);
  };
  w.appendChild(pl);
  const cd=el('<div class="card"></div>'),a=pr.anchor||t;
  const bar=el('<div class="row" style="margin-bottom:8px"></div>');
  [['dia','Día'],['semana','Semana'],['mes','Mes']].forEach(([id,l])=>{const b=el(`<button class="${pr.cal===id?'':'ghost'}">${l}</button>`);b.onclick=()=>{pr.cal=id;render();};bar.appendChild(b);});
  const nav=k=>{let x=pr.anchor||t;if(pr.cal==='mes'){const d=pDt(x);d.setMonth(d.getMonth()+k);x=pIso(d);}else x=pAdd(x,k*(pr.cal==='semana'?7:1));pr.anchor=x;render();};
  [['◀',()=>nav(-1)],['Hoy',()=>{pr.anchor=null;render();}],['▶',()=>nav(1)]].forEach(([l,f])=>{const b=el(`<button class="ghost">${l}</button>`);b.onclick=f;bar.appendChild(b);});
  cd.appendChild(bar);
  cd.appendChild(el(`<div class="small" style="margin-bottom:6px">${pDt(a).toLocaleDateString('es-CL',{month:'long',year:'numeric'})}${p.plan?` · plan de ${pNum(p.plan.ppd)} pág/día`:' · aún no hay calendario guardado'}</div>`));
  let days;
  if(pr.cal==='dia')days=[a];
  else if(pr.cal==='semana'){const s=pAdd(a,-((pDt(a).getDay()+6)%7));days=[...Array(7)].map((_,i)=>pAdd(s,i));}
  else{const f=a.slice(0,8)+'01',s=pAdd(f,-((pDt(f).getDay()+6)%7));days=[...Array(42)].map((_,i)=>pAdd(s,i));}
  const cell=s=>{
    const it=(p.plan?p.plan.items:[]).find(i=>i.d===s),ss=p.sessions.filter(x=>x.date===s),mins=ss.reduce((q,x)=>q+x.min,0);
    const cls=['pr-cd',pWork(p,s)?'':'off',(p.plan&&p.plan.fin&&s>p.plan.fin&&s<=p.objetivo)?'buf':'',s===t?'hoy':''].join(' ');
    return `<div class="${cls}"><b>${pDt(s).getDate()}</b>${it?`<div>${pLbl(it.pgs)}</div>`:''}${pr.cal==='dia'?ss.map(x=>`<div>Pág ${x.page} · ${escapeHtml(x.etapa)} · ${pFm(x.min)}</div>`).join(''):(mins?`<div>⏱ ${pFm(mins)}</div>`:'')}${s===p.objetivo?'<div>🎯 Objetivo</div>':''}</div>`;
  };
  cd.appendChild(el(`<div class="pr-cal" style="grid-template-columns:repeat(${pr.cal==='dia'?1:7},1fr)">${days.map(cell).join('')}</div>`));
  cd.appendChild(el('<div class="small" style="margin-top:6px">Días atenuados: no laborables · fondo gris: buffer antes de la fecha objetivo.</div>'));
  w.appendChild(cd);return w;
}

function pForm(p){
  const D=DATA.prod,n=!p,w=el('<div class="card"></div>');
  if(!DATA.stories.length){w.innerHTML='<h3>Nuevo proyecto</h3><p class="small">Primero crea una historia en el Tablero: cada proyecto de producción se vincula a una.</p>';const b=el('<button class="ghost">Volver</button>');b.onclick=()=>{pr.edit=null;render();};w.appendChild(b);return w;}
  const d=p||{name:'',storyId:DATA.stories[0].id,tipo:'One-shot',pages:[],inicio:pToday(),objetivo:pAdd(pToday(),30),dias:[1,2,3,4,5],horas:4,buffer:10,prioridad:'Media',etapas:P_ETAPAS.slice()};
  const opts=(arr,v)=>arr.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('');
  w.innerHTML=`<h3>${n?'Nuevo proyecto de producción':'Editar proyecto'}</h3>
  <label>Nombre</label><input type="text" id="fN" value="${escapeHtml(d.name)}" placeholder="One-shot — Producción">
  <label>Historia asociada (Tablero)</label><select id="fS" style="width:100%">${DATA.stories.map(s=>`<option value="${s.id}" ${s.id==d.storyId?'selected':''}>${escapeHtml(s.name)}</option>`).join('')}</select>
  <label>Tipo</label><select id="fT">${opts(['One-shot','Capítulo','Manga','Ilustración','Otro'],d.tipo)}</select>
  <label>Número total de páginas</label><input type="number" id="fP" min="1" value="${d.pages.length||20}">
  <div class="row"><div><label>Fecha de inicio</label><input type="date" id="fI" value="${d.inicio}"></div><div><label>Fecha objetivo</label><input type="date" id="fO" value="${d.objetivo}"></div></div>
  <label>Días disponibles para trabajar</label><div class="row" id="fD">${P_DIAS.map(([l,v])=>`<label style="display:flex;gap:3px;align-items:center;margin:0;font-weight:400"><input type="checkbox" value="${v}" ${d.dias.includes(v)?'checked':''}>${l}</label>`).join('')}</div>
  <div class="row"><div><label>Horas por día (aprox.)</label><input type="number" id="fH" min="0.5" step="0.5" value="${d.horas}"></div><div><label>Buffer de seguridad</label><select id="fB">${[0,5,10,15,20].map(x=>`<option value="${x}" ${x==d.buffer?'selected':''}>${x}%</option>`).join('')}</select></div><div><label>Prioridad</label><select id="fR">${opts(['Alta','Media','Baja'],d.prioridad)}</select></div></div>
  <label>Etapas de producción (una por línea, en orden: edita, borra o añade)</label><textarea id="fE" style="min-height:130px">${escapeHtml(d.etapas.join('\n'))}</textarea>
  <div class="row" style="margin-top:10px"><button id="fSv">Guardar</button><button class="ghost" id="fCn">Cancelar</button></div>`;
  w.querySelector('#fCn').onclick=()=>{pr.edit=null;render();};
  if(!n){const dl=el('<button class="ghost">Eliminar proyecto</button>');dl.onclick=()=>{if(confirm('¿Eliminar este proyecto de producción y sus sesiones? La historia del Tablero no se toca.')){D.projects=D.projects.filter(x=>x.id!==p.id);if(D.active===p.id)D.active=null;if(D.main===p.id)D.main=null;save();pr.edit=null;render();}};w.querySelector('.row:last-child').appendChild(dl);}
  w.querySelector('#fSv').onclick=()=>{
    const et=w.querySelector('#fE').value.split('\n').map(x=>x.trim()).filter(Boolean),dias=[...w.querySelectorAll('#fD input:checked')].map(x=>+x.value);
    const tot=Math.max(1,+w.querySelector('#fP').value||1),o=w.querySelector('#fO').value,i=w.querySelector('#fI').value;
    if(!et.length||!dias.length||!o||!i||o<i){alert('Revisa las fechas (objetivo posterior al inicio), al menos un día de trabajo y al menos una etapa.');return;}
    const q=p||{id:Date.now(),sessions:[],pages:[],plan:null},oldN=q.pages.length,oldO=q.objetivo;
    if(tot<oldN){if(!confirm(`Se eliminarán las últimas ${oldN-tot} página(s). ¿Continuar?`))return;q.pages=q.pages.slice(0,tot);}
    while(q.pages.length<tot)q.pages.push(newPage(q.pages.length+1));
    Object.assign(q,{name:w.querySelector('#fN').value.trim()||'Proyecto de producción',storyId:DATA.stories.find(s=>s.id==w.querySelector('#fS').value).id,tipo:w.querySelector('#fT').value,inicio:i,objetivo:o,dias,horas:+w.querySelector('#fH').value||4,buffer:+w.querySelector('#fB').value,prioridad:w.querySelector('#fR').value,etapas:et});
    if(n)D.projects.push(q);
    D.active=q.id;if(!D.main)D.main=q.id;pr.edit=null;pr.hoy=null;save();
    if(!n&&q.plan&&(oldN!==tot||oldO!==o))pReplan(q,oldN!==tot?`El proyecto ahora tiene ${tot} páginas. ¿Quieres recalcular el calendario?`:'Cambiaste la fecha objetivo. ¿Quieres recalcular el calendario?',q.plan.ppd);
    else render();
  };
  return w;
}
// Acceso limpio y de solo lectura para un futuro módulo "Manga Copilot"
window.MangaProduccion={
  proyectos:()=>DATA.prod.projects.map(p=>({id:p.id,nombre:p.name,principal:p.id===DATA.prod.main})),
  estado:id=>{const p=DATA.prod.projects.find(x=>x.id==id);if(!p)return null;const c=pCalc(p),r={...c};delete r._pri;r.hoy=pHoy(p,c);r.calendario=p.plan;r.sesiones=p.sessions;r.paginas=p.pages.map(g=>({n:g.n,estado:pgEstado(p,g),etapas:g.st,obs:g.obs,bloqueada:g.bloq,motivo:g.motivo}));return r;}
};

render();
