<script>
// ================= MAROKH (Manga Copilot) — script independiente: si falla, el resto de la app sigue =================
(function(){
try{
const MK={msgs:[],hist:[],tok:0,loading:false};
DATA.marokh=DATA.marokh||{nivel:'normal',tts:false};
const $=id=>document.getElementById(id);
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const cut=(s,n=300)=>String(s||'').slice(0,n);
const lc=s=>s?s[0].toLowerCase()+s.slice(1):s;
const proj=()=>PP()||null;
const curStory=()=>DATA.stories.find(s=>s.id===state.storyId)||(proj()&&storyOf(proj()))||null;
const cf=c=>({nombre:c.nombre,edad:c.edad,rol:c.rol,descripcion:c.descPersonalidad||c.desc,habilidadesDebilidades:c.habilidadesDebilidades||c.habilidades,motivacionesObjetivos:c.motivacionesObjetivos,notas:c.notas});
const pgOf=(p,n)=>{n=+n;return Number.isInteger(n)&&n>=1&&n<=p.pages.length?p.pages[n-1]:null;};
const go=(tab,v,sel)=>{state.tab=tab;if(tab==='prod'){pr.v=v||'panel';pr.sel=sel||null;pr.edit=null;}render();};
const replanUI=p=>{go('prod','panel');pReplan(p,'¿Cómo quieres replanificar?',null,['A) Mantener fecha objetivo → aumentar ritmo diario','B) Mantener ritmo actual → mover fecha estimada','C) Reorganizar manualmente']);};
function findChar(t){const q=norm(t),ss=curStory()?[curStory()]:DATA.stories;for(const s of ss){const c=s.chars.find(c=>c.nombre&&q.includes(norm(c.nombre)));if(c)return {c,s};}
  for(const s of DATA.stories){const c=s.chars.find(c=>c.nombre&&q.includes(norm(c.nombre)));if(c)return {c,s};}return null;}
function ctxChar(){const s=curStory();if(!s||!state.editChar||state.editChar==='new')return null;const c=s.chars.find(c=>c.id===state.editChar);return c?{c,s}:null;}

// ---------- READ TOOLS (solo lectura, sobre los datos existentes) ----------
const R={
  get_current_context(){const s=curStory(),p=proj(),ch=ctxChar(),run=DATA.prod.running,m={tablero:'Tablero',beta:'Beta Reader',puente:'Puente de Lanzamiento',prod:'Producción'}[state.tab];
    return {modulo:m,historia:s?s.name:null,seccion:state.tab==='tablero'?state.sub:state.tab==='prod'?pr.v:null,personaje:ch?ch.c.nombre:null,proyecto:p?p.name:null,pagina:state.tab==='prod'?(pr.sel||(run&&run.page)||null):null,timerActivo:run?{pagina:run.page,etapa:run.etapa}:null};},
  get_current_project(){const p=proj();return p?{id:p.id,nombre:p.name,tipo:p.tipo,historia:(storyOf(p)||{}).name||null,objetivo:p.objetivo}:null;},
  get_story(){const s=curStory();return s?{nombre:s.name,premisa:cut(s.premisa),generos:s.generos,estado:s.estado,tipo:s.tipo,mundo:cut(s.world.mundo),sistemaPoder:cut(s.world.poder),escalaClases:cut(s.world.escala),notas:cut(s.notas),sucesos:s.events.slice(0,15).map(e=>cut(e.texto,120)),personajes:s.chars.length}:null;},
  get_characters(){const s=curStory();return s?s.chars.slice(0,20).map(c=>{const x=cf(c);Object.keys(x).forEach(k=>x[k]=cut(x[k],200));return x;}):[];},
  get_character(q){const f=findChar(q)||ctxChar();return f?cf(f.c):null;},
  get_relationships(){const s=curStory();return s?s.relaciones.map(r=>{const a=s.chars.find(c=>c.id===r.a),b=s.chars.find(c=>c.id===r.b);return {a:a&&a.nombre,b:b&&b.nombre,tipo:r.tipo,desc:r.desc};}):[];},
  get_production_status(){const p=proj();if(!p)return null;const e=MangaProduccion.estado(p.id);['sesiones','calendario','paginas'].forEach(k=>delete e[k]);return e;},
  get_production_schedule(){const p=proj();return p&&p.plan?{ritmoPlan:p.plan.ppd,generado:p.plan.gen,fin:p.plan.fin,proximos:p.plan.items.filter(i=>i.d>=pToday()).slice(0,7).map(i=>({dia:i.d,paginas:i.pgs}))}:null;},
  get_pending_tasks(){const p=proj();if(!p)return [];return pCalc(p)._pri.slice(0,10).map(x=>({pagina:x.g.n,siguienteEtapa:nextEtapa(p,x.g)||null,razon:x.razon,estado:pgEstado(p,x.g)}));},
  get_blocked_tasks(){const p=proj();return p?p.pages.filter(g=>g.bloq).map(g=>({pagina:g.n,motivo:g.motivo||null})):[];},
  get_time_statistics(){const p=proj();if(!p)return null;const c=pCalc(p);return {minTotal:c.minTotal,minPorPagina:c.minPorPagina,ultimaSesion:c.ultimaSesion,prom5:c.prom5,etapas:Object.fromEntries(Object.entries(c.etapas).map(([e,v])=>[e,{promedio:v.avg,paginas:v.n}])),observaciones:pObs(p,c)};},
  get_page_details(n){const p=proj(),g=p&&pgOf(p,n);return g?{pagina:g.n,estado:pgEstado(p,g),etapas:g.st,observacionesPendientes:g.obs,bloqueada:g.bloq,motivo:g.motivo,enviadaABeta:g.beta,min:pgMin(p,g.n)}:null;},
  get_beta_reader_summary(){const p=proj(),a=typeof lastBetaAnalysis!=='undefined'?lastBetaAnalysis:null;
    return {analisisDeEstaSesion:a?{problemas:(a.topProblemas||[]).map(x=>({titulo:x.titulo,tipo:x.tipo,solucion:cut(x.solucion,150)})),fortalezas:(a.fortalezas||[]).map(f=>f.titulo)}:null,paginasConObservacionesMarcadas:p?p.pages.filter(g=>g.obs>0).map(g=>({pagina:g.n,pendientes:g.obs})):[]};},
  get_launch_content(){return DATA.puente.biblioteca.slice(-10).map(i=>({titulo:i.titulo,tipo:i.tipo,plataforma:i.plataforma,formato:i.formato,estado:i.estado||null}));},
  get_content_calendar(){const o={};DATA.puente.biblioteca.filter(i=>i.tipo==='publicacion').forEach(i=>(o[i.estado]=o[i.estado]||[]).push(i.titulo));return o;}
};

// ---------- WRITE TOOLS (validan y devuelven {ok,msg}; nunca borran) ----------
const W={
  start_timer({page,etapa}){const p=proj();if(!p)return {ok:false,msg:'No hay proyecto de producción activo.'};const g=pgOf(p,page);if(!g)return {ok:false,msg:`La página ${page} no existe en este proyecto.`};
    const D=DATA.prod;if(D.running)return {ok:false,msg:`Ya hay un timer en marcha (Página ${D.running.page} — ${D.running.etapa}).`};
    const e=p.etapas.includes(etapa)?etapa:(nextEtapa(p,g)||p.etapas[0]);if(!e)return {ok:false,msg:'El proyecto no tiene etapas.'};
    D.running={pid:p.id,page:g.n,etapa:e,start:Date.now()};return {ok:true,msg:`Timer iniciado: Página ${g.n} — ${e}.`};},
  stop_timer(){const D=DATA.prod,r=D.running;if(!r)return {ok:false,msg:'No hay ningún timer en marcha.'};const p=D.projects.find(x=>x.id===r.pid),end=Date.now(),min=(end-r.start)/60000;D.running=null;
    if(!p||min<0.5)return {ok:true,msg:'Timer detenido (menos de 30 s: la sesión no se registró).'};
    p.sessions.push({id:end,date:pIso(r.start),start:new Date(r.start).toISOString(),end:new Date(end).toISOString(),min:Math.round(min*10)/10,page:r.page,etapa:r.etapa});
    return {ok:true,msg:`Timer detenido: Página ${r.page} — ${r.etapa}, ${pFm(min)}.`,data:{page:r.page,etapa:r.etapa}};},
  set_stage({page,etapa,value}){const p=proj(),g=p&&pgOf(p,page);if(!g)return {ok:false,msg:'La página no existe.'};if(!p.etapas.includes(etapa))return {ok:false,msg:`La etapa "${etapa}" no existe en este proyecto.`};g.st[etapa]=!!value;return {ok:true,msg:`${etapa} de la página ${g.n} ${value?'marcada como completada':'desmarcada'}.`};},
  mark_page_done({page}){const p=proj(),g=p&&pgOf(p,page);if(!g)return {ok:false,msg:`La página ${page} no existe.`};if(!p.etapas.length)return {ok:false,msg:'El proyecto no tiene etapas.'};p.etapas.forEach(e=>g.st[e]=true);return {ok:true,msg:`Página ${g.n} marcada como terminada.`};},
  set_block({page,bloq,motivo}){const p=proj(),g=p&&pgOf(p,page);if(!g)return {ok:false,msg:'La página no existe.'};g.bloq=!!bloq;if(motivo)g.motivo=String(motivo).slice(0,300);return {ok:true,msg:`Página ${g.n} ${bloq?'bloqueada':'desbloqueada'}.`};},
  save_idea({texto}){if(!texto||!String(texto).trim())return {ok:false,msg:'La idea está vacía.'};DATA.ideas.push({id:Date.now(),texto:String(texto).trim()});return {ok:true,msg:'Idea guardada en Ideas rápidas del Tablero.'};},
  add_char_note({storyId,charId,texto}){const s=DATA.stories.find(x=>x.id===storyId),c=s&&s.chars.find(x=>x.id===charId);if(!c)return {ok:false,msg:'No encuentro ese personaje.'};if(!texto||!String(texto).trim())return {ok:false,msg:'El dato está vacío.'};c.notas=(c.notas?c.notas+'\n':'')+'[Canon] '+String(texto).trim();return {ok:true,msg:`Guardado en las notas de ${c.nombre||'el personaje'}.`};},
  update_calendar({mode}){const p=proj();if(!p)return {ok:false,msg:'No hay proyecto activo.'};const c=pCalc(p),rest=c.pendientes;if(!rest)return {ok:false,msg:'No hay páginas pendientes.'};let ppd;
    if(mode==='fecha'){if(!c.diasProduccion)return {ok:false,msg:'No quedan días de trabajo antes de la fecha objetivo.'};ppd=rest/c.diasProduccion;}
    else if(mode==='ritmo'){ppd=c.ritmoReal||(p.plan&&p.plan.ppd);if(!ppd)return {ok:false,msg:'Datos insuficientes para mantener el ritmo.'};}
    else return {ok:false,msg:'Modo no válido.'};
    p.plan=pPlan(p,ppd,rest);return {ok:true,msg:`Calendario actualizado: ${pNum(ppd)} pág/día, término estimado ${pDate(p.plan.fin)}.`};}
};
// Solo se dice "Listo" si la herramienta devolvió ok.
function exec(tool,args){let r;try{r=W[tool](args)||{ok:false,msg:'Sin respuesta.'};}catch(e){r={ok:false,msg:e.message};}
  if(r.ok){pr.hoy=null;save();try{render();}catch(e){}}
  say(r.ok?'Listo. '+r.msg:'No se pudo completar: '+r.msg);return r;}
const yn=(txt,fn)=>say(txt,[{t:'Sí',fn},{t:'No',fn:()=>say('Sin cambios.')}]);

// ---------- Respuestas locales (sin llamar al modelo) ----------
function local(raw){
  const t=norm(raw),p=proj(),run=DATA.prod.running,m=t.match(/pagina\s*(\d+)|pag\.?\s*(\d+)/),n=m?+(m[1]||m[2]):null;
  const need=()=>{if(p)return false;say('No hay un proyecto de producción. Crea uno en la pestaña Producción.',[{t:'Ir a Producción',fn:()=>go('prod')}]);return true;};
  let mm;
  if(/marca\w*.*pagina\s*\d+.*(terminad|complet|list)/.test(t)){if(need())return true;if(!pgOf(p,n)){say(`La página ${n} no existe en este proyecto.`);return true;}yn(`¿Marco la página ${n} como terminada (todas sus etapas)?`,()=>exec('mark_page_done',{page:n}));return true;}
  if(/(inicia|empieza|arranca|comienza|activa)\w*.*(timer|cronometro|sesion)|trabajar\w*\s+en|voy a trabajar/.test(t)){
    if(need())return true;const c=pCalc(p),pg=n||pr.sel||(c._pri[0]&&c._pri[0].g.n);
    if(!pg){say('No encuentro una página pendiente. Indícame cuál (por ejemplo: "trabajar en página 3").');return true;}
    const e=p.etapas.find(x=>t.includes(norm(x)));const r=exec('start_timer',{page:pg,etapa:e});if(r.ok&&/trabajar/.test(t))go('prod','pag',pg);return true;}
  if(/^(ya )?(termine|acabe|listo|deten\w*|para el timer)\b|termina\w* la sesion/.test(t)){
    if(!run){say('No hay ningún timer en marcha. ¿Qué terminaste? Dime la página y la etapa.');return true;}
    const r=exec('stop_timer');const g=r.data&&p&&pgOf(p,r.data.page);
    if(r.ok&&g&&!g.st[r.data.etapa])yn('¿Quieres marcar la etapa como completada?',()=>exec('set_stage',{page:r.data.page,etapa:r.data.etapa,value:true}));return true;}
  if(/que hice hoy|que he hecho hoy|resumen (del )?dia/.test(t)){
    if(need())return true;const ss=p.sessions.filter(x=>x.date===pToday());if(!ss.length){say('Hoy no hay sesiones registradas.');return true;}
    const g={};ss.forEach(x=>{const k=`Página ${x.page} — ${x.etapa}`;g[k]=(g[k]||0)+x.min;});
    say('Hoy trabajaste:\n'+Object.entries(g).map(([k,v])=>`- ${k} — ${pFm(v)}`).join('\n')+`\n\nTotal: ${pFm(ss.reduce((a,x)=>a+x.min,0))}\nPáginas trabajadas: ${new Set(ss.map(x=>x.page)).size}`);return true;}
  if(/que hago ahora|que sigue|que hago primero/.test(t)){
    if(need())return true;const c=pCalc(p),h=pHoy(p,c);if(!h.items.length){say('No tienes tareas pendientes ahora mismo.');return true;}
    const it=h.items,e=nextEtapa(p,p.pages[it[0].n-1]);
    let s=`Tu prioridad actual es ${lc(it[0].txt)} porque ${c._pri[0].razon}.\nTiempo estimado: ${pFm(it[0].min)}${h.est?' (estimación aproximada)':''}.`;
    if(it[1])s+=`\n\nDespués:\n2. ${it[1].txt}.`+(it[2]?`\n3. ${it[2].txt}.`:'');
    say(s,[{t:`Trabajar en página ${it[0].n}`,fn:()=>{exec('start_timer',{page:it[0].n,etapa:e});go('prod','pag',it[0].n);}},{t:'Ver tareas',fn:()=>go('prod','panel')}]);return true;}
  if(/(que|cuanto) (hago|debo hacer|deberia hacer|tengo que hacer|deberia (dibujar|avanzar)) hoy|que tengo que hacer hoy/.test(t)){
    if(need())return true;const c=pCalc(p),h=pHoy(p,c);if(!h.items.length){say('No tienes tareas pendientes.');return true;}
    say('Hoy:\n'+h.items.map((x,i)=>`${i+1}. ${x.txt}`).join('\n')+`\n\nTiempo estimado: ${pFm(h.tot)}${h.est?' (estimación aproximada)':''}.`+(c.ritmoNecesario!=null?`\nRitmo necesario para tu fecha: ${pNum(c.ritmoNecesario)} pág/día.`:''),[{t:'Ver tareas',fn:()=>go('prod','panel')}]);return true;}
  if(/(voy|estoy|vamos) (atrasad|adelantad)|voy a tiempo|puedo terminar (antes|a tiempo)/.test(t)){
    if(need())return true;const c=pCalc(p);if(!c.pendientes){say('Todas las páginas están terminadas.');return true;}
    const a=Math.round(c.atrasoDias),o=[];
    o.push(p.plan?(a>=1?`Según tu calendario guardado, estás ${a} día(s) por detrás.`:'Según tu calendario guardado, vas al día.'):'No tienes un calendario guardado, así que no puedo compararte contra un plan.');
    o.push(c.ritmoReal!=null&&c.ritmoNecesario!=null?`Ritmo real ${pNum(c.ritmoReal)} vs necesario ${pNum(c.ritmoNecesario)} pág/día.`:'No tengo suficientes datos para estimar tu ritmo real.');
    if(c.diffDias!=null)o.push(c.diffDias>0?`Con el ritmo actual terminarías unos ${c.diffDias} día(s) después de la fecha objetivo.`:c.diffDias===0?'Con el ritmo actual terminarías justo en la fecha objetivo.':`Con el ritmo actual terminarías unos ${-c.diffDias} día(s) antes de la fecha objetivo.`);
    say(o.join('\n'),a>=1?[{t:'Replanificar',fn:()=>replanUI(p)}]:null);return true;}
  if(/cuantas paginas (llevo|tengo|van|he)/.test(t)){if(need())return true;const c=pCalc(p);say(`${c.hechas} de ${c.total}.`);return true;}
  if(/cuanto me falta|paginas pendientes|tareas pendientes|que tareas tengo/.test(t)){
    if(need())return true;const c=pCalc(p);say(`${c.pendientes} página(s) pendiente(s) de ${c.total}.`+(c.pendientes?`\nTiempo restante estimado: ${pFm(c.minRestante)}${c.restanteEstimado?' (estimación aproximada)':''}.`:'')+(c.bloqueos.length?`\n${c.bloqueos.length} bloqueada(s).`:''),[{t:'Ver tareas',fn:()=>go('prod','pag')}]);return true;}
  if(/resumen del proyecto|como voy\b/.test(t)){
    if(need())return true;const c=pCalc(p),ob=p.pages.filter(g=>g.obs>0).length;
    say(`${p.name}\nProgreso: ${c.hechas}/${c.total}\nRitmo: ${c.ritmoReal!=null?pNum(c.ritmoReal)+' pág/día':'datos insuficientes'}${c.ritmoNecesario!=null?` (necesario ${pNum(c.ritmoNecesario)})`:''}\nFecha objetivo: ${pDate(p.objetivo)} · estimada: ${c.estimada?pDate(c.estimada):'datos insuficientes'}\nPendientes: ${c.pendientes} · Bloqueos: ${c.bloqueos.length} · Con observaciones: ${ob}\nSiguiente prioridad: ${c._pri[0]?'página '+c._pri[0].g.n:'—'}`,[{t:'Ver panel',fn:()=>go('prod','panel')}]);return true;}
  if(/cuello de botella|perder tiempo|cuanto tiempo (estoy )?tardando|tiempo por pagina/.test(t)){
    if(need())return true;const c=pCalc(p),o=pObs(p,c);
    say((c.minPorPagina!=null?`Promedio por página terminada: ${pFm(c.minPorPagina)}.\n`:'')+(o.length?o.join('\n'):'No tengo suficientes datos para detectar un cuello de botella. Registra más sesiones.'));return true;}
  if(/que personajes tengo|lista de personajes|cuantos personajes/.test(t)){
    const ss=curStory()?[curStory()]:DATA.stories;if(!ss.length){say('No tienes historias registradas.');return true;}
    say(ss.map(s=>`${s.name}: ${s.chars.length?s.chars.map(c=>c.nombre||'(sin nombre)').join(', '):'sin personajes registrados'}`).join('\n'));return true;}
  if((mm=t.match(/relacion (?:tienen|entre) (.+?) y (.+?)\??$/))){
    const s=curStory()||DATA.stories.find(s=>s.chars.length),f=x=>s&&s.chars.find(c=>c.nombre&&norm(c.nombre)===x.trim());const a=f(mm[1]),b=f(mm[2]);
    if(!a||!b){say('No encuentro uno de esos personajes en la historia actual.');return true;}
    const r=s.relaciones.filter(r=>(r.a===a.id&&r.b===b.id)||(r.a===b.id&&r.b===a.id));
    say(r.length?r.map(x=>`Según tu canon: ${a.nombre} y ${b.nombre} — ${x.tipo}${x.desc?': '+x.desc:''}.`).join('\n'):`No tienes registrada una relación entre ${a.nombre} y ${b.nombre}.`);return true;}
  if(/que (le )?falta|que datos (le )?faltan/.test(t)){
    const f=findChar(raw)||ctxChar();if(!f){say('Abre la ficha de un personaje o dime su nombre.');return true;}
    const x=cf(f.c),lab={edad:'edad',rol:'rol',descripcion:'descripción y personalidad',habilidadesDebilidades:'habilidades y debilidades',motivacionesObjetivos:'motivaciones y objetivos',notas:'notas clave'},vac=Object.keys(lab).filter(k=>!String(x[k]||'').trim()).map(k=>lab[k]);
    say(vac.length?`A ${x.nombre||'este personaje'} le falta registrar: ${vac.join(', ')}.`:`${x.nombre||'El personaje'} tiene todos los campos completos. Que estén completos no dice si están bien desarrollados.`);return true;}
  if((mm=t.match(/^busca\w* (?:informacion )?(?:sobre|de) (.+)/))){
    const f=findChar(mm[1]);if(!f){say('No encuentro ese personaje.');return true;}const x=cf(f.c);
    say(`${x.nombre} (${f.s.name})\n`+Object.entries(x).filter(([k,v])=>k!=='nombre'&&String(v||'').trim()).map(([k,v])=>`${k}: ${cut(v,200)}`).join('\n'));return true;}
  if((mm=raw.match(/^(?:anota|guarda|apunta)\w*\s+(?:esta\s+)?idea\s*[:,-]?\s*(.+)/i))){yn(`¿Guardo esta idea en Ideas rápidas del Tablero?\n«${cut(mm[1],200)}»`,()=>exec('save_idea',{texto:mm[1]}));return true;}
  if((mm=raw.match(/^(?:guarda|anota|apunta)\w*\s+que\s+(.+)/i))){
    const f=findChar(mm[1])||ctxChar();if(!f){say('¿A qué personaje corresponde? Menciónalo por nombre o abre su ficha.');return true;}
    yn(`Voy a añadir esto a las notas de ${f.c.nombre} (historia: ${f.s.name}) como canon:\n«${cut(mm[1],200)}»\n¿Confirmas?`,()=>exec('add_char_note',{storyId:f.s.id,charId:f.c.id,texto:mm[1]}));return true;}
  if(/reorganiza\w*.*calendario|replanifica/.test(t)){
    if(need())return true;const c=pCalc(p),rest=c.pendientes;if(!rest){say('No hay páginas pendientes que reorganizar.');return true;}
    const o=[],b=[];
    if(c.diasProduccion){const q=pPlan(p,rest/c.diasProduccion,rest);o.push(`Mantener fecha objetivo: ${pNum(rest/c.diasProduccion)} pág/día, término estimado ${pDate(q.fin)}.`);b.push({t:'Mantener fecha',fn:()=>exec('update_calendar',{mode:'fecha'})});}
    if(c.ritmoReal){const q=pPlan(p,c.ritmoReal,rest);o.push(`Mantener ritmo actual: ${pNum(c.ritmoReal)} pág/día, término estimado ${pDate(q.fin)}.`);b.push({t:'Mantener ritmo',fn:()=>exec('update_calendar',{mode:'ritmo'})});}
    if(!b.length){say('No tengo datos suficientes para proponer una reorganización.');return true;}
    b.push({t:'No cambiar',fn:()=>say('Sin cambios.')});say('Encontré estas opciones (no se aplica nada sin tu confirmación):\n'+o.join('\n'),b);return true;}
  if(/beta reader|observaciones|problemas (encontro|detecto)/.test(t)){
    const b=R.get_beta_reader_summary(),o=[];
    if(b.analisisDeEstaSesion)o.push('Último análisis de Beta Reader (de esta sesión): '+(b.analisisDeEstaSesion.problemas.map(x=>x.titulo).join('; ')||'sin problemas destacados')+'.');
    if(b.paginasConObservacionesMarcadas.length)o.push('Páginas con observaciones marcadas en Producción: '+b.paginasConObservacionesMarcadas.map(x=>`${x.pagina} (${x.pendientes})`).join(', ')+'.');
    say(o.length?o.join('\n'):'No hay análisis de Beta Reader guardado (no se conserva al recargar) ni observaciones marcadas en Producción.',b.paginasConObservacionesMarcadas.length?[{t:'Ver observaciones',fn:()=>go('prod','pag')}]:null);return true;}
  return false;
}

// ---------- Router de intenciones + recuperación contextual (solo consulta lo necesario) ----------
const IN=[['TIMER',/timer|cronometro|sesion/],['CALENDARIO',/calendario|planific|fecha objetivo/],['TAREAS',/tarea|pendiente|bloque/],['PRODUCCIÓN',/produccion|pagina|ritmo|atrasad|avance|lineart|boceto|tonos|fondos|cuello|tiempo|terminar/],['BETA_READER',/beta|observacion|corregir|problema/],['LANZAMIENTO',/lanzamiento|publicacion|contenido|tiktok|instagram|gancho|hook|redes/],['PERSONAJES',/personaje|relacion|motivacion|edad/],['HISTORIA',/historia|premisa|mundo|trama|canon/],['IDEACIÓN',/bloquead|idea|escena|propon|posibilidad/],['BÚSQUEDA',/busca|encuentra/]];
const intentOf=raw=>{const t=norm(raw);const h=IN.find(([k,r])=>r.test(t));return h?h[0]:'GENERAL';};
function retrieve(i,raw){
  const d={};
  if(['PRODUCCIÓN','TIMER','TAREAS','CALENDARIO'].includes(i)){d.produccion=R.get_production_status();d.pendientes=R.get_pending_tasks();d.bloqueos=R.get_blocked_tasks();d.tiempo=R.get_time_statistics();if(i==='CALENDARIO')d.calendario=R.get_production_schedule();}
  if(i==='BETA_READER'){d.beta=R.get_beta_reader_summary();d.pendientes=R.get_pending_tasks();}
  if(i==='LANZAMIENTO'){d.contenido=R.get_launch_content();d.calendarioContenido=R.get_content_calendar();}
  if(['PERSONAJES','HISTORIA','IDEACIÓN','BÚSQUEDA'].includes(i)){d.historia=R.get_story();d.personajes=R.get_characters();d.relaciones=R.get_relationships();const f=findChar(raw)||ctxChar();if(f)d.personajeConsultado=cf(f.c);}
  return d;
}
MODULE_PROMPTS.MAROKH=`MODULE: MAROKH
Rol: Marokh, copiloto de producción y creación de manga digital dentro de la app. Asistente profesional, claro, directo y conciso; tono natural y cercano; sin emojis, sin frases motivacionales, sin fingir emociones, sin actuar como personaje.
Principio: Marokh propone, la autora decide. Nunca asumas que una sugerencia fue aceptada.
Reglas: responde SOLO con DATOS_CONSULTADOS y CONTEXTO_ACTUAL. Si un dato no está registrado, dilo ("No tienes registrada esa información") y no lo inventes ni uses conocimiento externo para convertir una hipótesis en canon. Distingue CANON (registrado por la autora: "Según tu canon...") de PROPUESTA (idea tuya: "Como propuesta..."), y HECHO / OBSERVACIÓN / INFERENCIA / SUGERENCIA; nunca presentes una inferencia como hecho ni afirmes causas que los datos no demuestren. Si CONTEXTO_ACTUAL indica un personaje, página o proyecto abierto, úsalo para resolver referencias ambiguas. Preguntas simples: respuesta breve. Decisiones importantes: qué recomiendas, por qué, qué datos usaste y qué cambiaría la recomendación. Si la autora está bloqueada creativamente: 3 posibilidades con consecuencias, ventajas y problemas, respetando el canon, sin elegir por ella. No ejecutas acciones ni modificas datos: si algo requiere cambios, indica que puede pedirlo (marcar página, iniciar timer, guardar idea) y se confirmará con botones. Nunca propongas borrar nada.`;
async function ai(raw){
  const tok=++MK.tok,i=intentOf(raw),lv=DATA.marokh.nivel;
  const sys=buildSystemPrompt({module:'MAROKH'})+`\nNIVEL DE INTERVENCIÓN: ${lv}. ${lv==='minimo'?'Solo responde lo preguntado, sin recomendaciones no pedidas.':lv==='proactivo'?'Responde y señala problemas relevantes que veas en los datos.':'Responde y, si aporta, añade una recomendación breve.'}`;
  const user=`CONTEXTO_ACTUAL: ${JSON.stringify(R.get_current_context())}\nINTENCIÓN: ${i}\nDATOS_CONSULTADOS: ${JSON.stringify(retrieve(i,raw))}\n\nCONSULTA: ${raw}`;
  const msgs=[...MK.hist.slice(-8),{role:'user',content:[{type:'text',text:user}]}],fn=activeProvider()==='gemini'?callGemini:callAnthropic;
  MK.loading=true;draw();let out,ok=false;
  for(let k=0;k<2&&!ok&&tok===MK.tok;k++){try{out=await Promise.race([fn(msgs,sys),new Promise((_,rj)=>setTimeout(()=>rj(new Error('timeout')),30000))]);ok=true;}catch(e){out=e;}}
  if(tok!==MK.tok)return;MK.loading=false;
  if(!ok)say('Marokh no está disponible temporalmente. El resto de la aplicación sigue funcionando.');
  else if(out===null||out==='')say('Para esta consulta necesito la IA: configura tu clave de API en ⚙ Configuración. Las respuestas directas (progreso, timer, tareas, resumen) funcionan sin ella.');
  else{MK.hist.push({role:'user',content:[{type:'text',text:raw}]},{role:'assistant',content:[{type:'text',text:out}]});MK.hist=MK.hist.slice(-12);say(out);}
}

// ---------- Interfaz ----------
function speak(t){try{if(DATA.marokh.tts&&window.speechSynthesis&&t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-CL';speechSynthesis.speak(u);}}catch(e){}}
function say(text,btns){MK.msgs.push({r:'a',text,btns});MK.loading=false;speak(text);draw();}
const ctxLine=()=>{const c=R.get_current_context();return [c.modulo,c.modulo==='Producción'?c.proyecto:c.historia,c.seccion,c.personaje,c.pagina?'Pág '+c.pagina:null].filter(Boolean).join(' › ');};
function draw(){
  const b=$('mkMsgs');if(!b)return;b.innerHTML='';
  MK.msgs.forEach(m=>{const d=document.createElement('div');d.className='mkm '+(m.r==='u'?'u':'a');d.textContent=m.text;
    if(m.btns&&m.btns.length){const r=document.createElement('div');r.className='mkb';m.btns.forEach(o=>{const x=document.createElement('button');x.className='ghost';x.textContent=o.t;x.disabled=!!m.done;x.onclick=()=>{if(m.done)return;m.done=true;try{o.fn();}catch(e){say('Error: '+e.message);}draw();};r.appendChild(x);});d.appendChild(r);}
    b.appendChild(d);});
  if(MK.loading){const d=document.createElement('div');d.className='mkm a';d.textContent='Pensando… ';const c=document.createElement('button');c.className='ghost';c.textContent='Cancelar';c.onclick=()=>{MK.tok++;MK.loading=false;draw();};d.appendChild(c);b.appendChild(d);}
  b.scrollTop=b.scrollHeight;$('mkCtx').textContent=ctxLine();
}
function alerts(){
  const a=[],p=proj();if(!p)return a;const c=pCalc(p),ob=p.pages.filter(g=>g.obs>0).length;
  if(c.bloqueos.length)a.push({t:`Detecté que tienes ${c.bloqueos.length} tarea(s) bloqueada(s).`,b:'Ver tareas',fn:()=>go('prod','pag')});
  if(Math.round(c.atrasoDias)>=1)a.push({t:`Tu calendario está atrasado ${Math.round(c.atrasoDias)} día(s).`,b:'Replanificar',fn:()=>replanUI(p)});
  if(ob)a.push({t:`Hay ${ob} página(s) con observaciones pendientes.`,b:'Ver observaciones',fn:()=>go('prod','pag')});
  return a;
}
function badge(){const b=$('mkBadge');if(!b)return;const n=DATA.marokh.nivel==='proactivo'?alerts().length:0;b.textContent=n||'';b.style.display=n?'inline-block':'none';const c=$('mkCtx');if(c)c.textContent=ctxLine();}
async function send(txt){
  const raw=(txt!==undefined?txt:$('mkIn').value).trim();if(!raw)return;$('mkIn').value='';
  const clean=raw.replace(/^marokh[\s,:.\-]*/i,'').trim()||raw;MK.msgs.push({r:'u',text:raw});draw();
  try{if(!local(clean))await ai(clean);}catch(e){say('Marokh tuvo un problema con esa consulta. El resto de la app no se ve afectado.');}
}
const root=document.createElement('div');
root.innerHTML=`<button id="mkFab">Marokh<i id="mkBadge"></i></button><div id="mkPanel" hidden>
<div style="padding:10px;border-bottom:1px solid var(--line)"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><b style="font-family:Georgia,serif;font-size:17px">Marokh</b><div class="row" style="flex-wrap:nowrap"><select id="mkLv"><option value="minimo">Mínimo</option><option value="normal">Normal</option><option value="proactivo">Proactivo</option></select><label style="margin:0;display:flex;gap:3px;align-items:center;font-weight:400"><input type="checkbox" id="mkTts">Voz</label><button class="ghost" id="mkX">✕</button></div></div><div class="small" id="mkCtx"></div></div>
<div id="mkMsgs" style="flex:1;overflow:auto;padding:8px 10px"></div>
<div class="row" id="mkQ" style="padding:0 10px 6px"></div>
<div class="row" style="padding:8px 10px;border-top:1px solid var(--line);flex-wrap:nowrap"><input type="text" id="mkIn" placeholder="Pregúntale a Marokh…" style="flex:1;min-width:0"><button id="mkS">Enviar</button><button class="ghost" id="mkMic" style="font-size:12px">Mantén para hablar</button></div></div>`;
document.body.appendChild(root);
$('mkLv').value=DATA.marokh.nivel;$('mkTts').checked=!!DATA.marokh.tts;
$('mkLv').onchange=e=>{DATA.marokh.nivel=e.target.value;save();badge();};
$('mkTts').onchange=e=>{DATA.marokh.tts=e.target.checked;save();};
$('mkX').onclick=()=>{$('mkPanel').hidden=true;};
$('mkS').onclick=()=>send();
$('mkIn').onkeydown=e=>{if(e.key==='Enter')send();};
['¿Qué hago ahora?','¿Cómo voy?','¿Qué hice hoy?'].forEach(q=>{const b=document.createElement('button');b.className='ghost';b.style.fontSize='12px';b.textContent=q;b.onclick=()=>send(q);$('mkQ').appendChild(b);});
$('mkFab').onclick=()=>{const pn=$('mkPanel');pn.hidden=!pn.hidden;if(!pn.hidden){if(DATA.marokh.nivel==='proactivo'&&!MK.alerted){MK.alerted=true;alerts().forEach(a=>MK.msgs.push({r:'a',text:a.t,btns:[{t:a.b,fn:a.fn}]}));}draw();$('mkIn').focus();}else MK.alerted=false;};
// Push-to-talk (opcional: la app funciona igual sin voz)
const SR=window.SpeechRecognition||window.webkitSpeechRecognition,mic=$('mkMic');let rec=null;
if(!SR)mic.style.display='none';
else{const stop=()=>{try{rec&&rec.stop();}catch(e){}rec=null;mic.textContent='Mantén para hablar';};
  mic.onpointerdown=e=>{e.preventDefault();try{rec=new SR();rec.lang='es-CL';rec.interimResults=false;rec.onresult=ev=>send(ev.results[0][0].transcript);rec.onerror=stop;rec.start();mic.textContent='Escuchando…';}catch(er){stop();}};
  mic.onpointerup=stop;mic.onpointerleave=stop;mic.onpointercancel=stop;}
const _r=render;render=function(){_r();try{badge();}catch(e){}};
badge();
window.Marokh={read:R,write:W,ask:send};
}catch(e){console.error('Marokh no pudo iniciarse; el resto de la app sigue funcionando.',e);}
})();
